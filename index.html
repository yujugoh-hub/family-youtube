<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HARMONY</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;
  background:#f6f7fb;
  color:#202124
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid #e5e7eb
}

.head{
  max-width:1200px;
  margin:auto;
  min-height:70px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:15px
}

.logo{
  border:0;
  background:none;
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:900
}

.logoIcon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  display:grid;
  place-items:center;
  color:white;
  font-size:23px
}

.logoTitle{font-size:22px}
.logoSub{font-size:11px;color:#777}

.search{
  flex:1;
  max-width:560px;
  margin:auto;
  display:flex
}

.search input{
  width:100%;
  height:44px;
  border:1px solid #ddd;
  border-radius:23px 0 0 23px;
  padding:0 16px;
  outline:none
}

.search button{
  width:52px;
  border:0;
  border-radius:0 23px 23px 0;
  background:#111827;
  color:white
}

.topButtons{display:flex;gap:7px}

.circle{
  width:42px;
  height:42px;
  border:1px solid #ddd;
  border-radius:50%;
  background:#fff
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:9px 18px;
  display:flex;
  gap:8px;
  overflow-x:auto
}

.nav button{
  border:0;
  padding:9px 16px;
  border-radius:20px;
  background:#f0f1f5;
  white-space:nowrap
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 70px
}

.hero{
  border-radius:25px;
  padding:30px;
  margin-bottom:28px;
  background:linear-gradient(135deg,#ede9fe,#fce7f3);
  border:1px solid #e9d5ff
}

.hero h1{margin:0 0 8px;font-size:34px}
.hero p{margin:0 0 20px;color:#666}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap
}

.primary,.secondary{
  border-radius:12px;
  padding:11px 16px;
  font-weight:800
}

.primary{
  border:0;
  background:#7c3aed;
  color:#fff
}

.secondary{
  border:1px solid #ddd;
  background:#fff
}

.title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:25px 0 14px
}

.title h2{margin:0;font-size:21px}
.count{color:#777;font-size:13px}

.channels{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px
}

.channel{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:16px
}

.avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:white;
  font-size:27px;
  margin-bottom:10px
}

.channelName{font-weight:900}
.channelDesc{font-size:13px;color:#777;margin:5px 0 12px}

.channel button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:9px;
  background:#f1f1f4
}

.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:22px 16px
}

.videoCard{min-width:0}

.thumb{
  aspect-ratio:16/9;
  border-radius:14px;
  overflow:hidden;
  background:#ddd;
  cursor:pointer
}

.thumb video{
  width:100%;
  height:100%;
  object-fit:cover
}

.placeholder{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font-size:50px;
  background:linear-gradient(135deg,#ede9fe,#fce7f3)
}

.videoInfo{
  display:flex;
  gap:9px;
  padding-top:9px
}

.mini{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#fff;
  flex-shrink:0
}

.videoTitle{
  font-weight:800;
  line-height:1.4
}

.meta{
  color:#777;
  font-size:12px;
  margin-top:3px;
  line-height:1.5
}

.videoButtons{
  display:flex;
  gap:6px;
  margin-top:7px
}

.videoButtons button{
  border:0;
  border-radius:9px;
  background:#f0f1f4;
  padding:6px 9px;
  font-size:12px
}

.active{
  background:#ede9fe!important;
  color:#6d28d9
}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:#fff;
  border:1px dashed #ccc;
  border-radius:18px;
  padding:45px 20px;
  color:#777
}

.modalBg{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.6)
}

.modalBg.show{display:flex}

.modal{
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:21px
}

.small{width:min(460px,100%)}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px
}

.modalHead h2{margin:0}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#eee
}

.field{margin-bottom:14px}
.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  outline:none;
  background:#fff
}

.field textarea{
  min-height:90px;
  resize:vertical
}

.modalButtons{
  display:flex;
  justify-content:flex-end;
  gap:8px
}

#camera{
  width:100%;
  max-height:430px;
  background:#111;
  border-radius:15px
}

.viewer video{
  width:100%;
  max-height:450px;
  background:#000;
  border-radius:14px
}

.viewerTitle{
  font-size:23px;
  font-weight:900;
  margin:14px 0 5px
}

.comments{
  border-top:1px solid #eee;
  margin-top:17px;
  padding-top:15px
}

.commentForm{
  display:flex;
  gap:7px
}

.commentForm input{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px
}

.commentForm button{
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  padding:0 14px
}

.comment{
  padding:10px 0;
  border-bottom:1px solid #eee
}

.comment b{font-size:13px}
.comment div{font-size:14px;margin-top:3px}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%,100px);
  opacity:0;
  transition:.25s;
  z-index:300;
  background:#111827;
  color:#fff;
  padding:12px 17px;
  border-radius:12px
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1
}

@media(max-width:700px){
  .head{flex-wrap:wrap}
  .search{order:3;flex-basis:100%}
  .topButtons{margin-left:auto}
  .hero{padding:22px}
  .hero h1{font-size:27px}
  .videos{grid-template-columns:1fr}
  .channels{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:430px){
  .logoSub{display:none}
  .channels{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="head">

    <button class="logo" onclick="home()">
      <div class="logoIcon">🎵</div>
      <div>
        <div class="logoTitle">HARMONY</div>
        <div class="logoSub">우리 가족 영상 공간</div>
      </div>
    </button>

    <div class="search">
      <input id="search" placeholder="동영상이나 채널 검색"
             onkeydown="if(event.key==='Enter')searchVideos()">
      <button onclick="searchVideos()">🔍</button>
    </div>

    <div class="topButtons">
      <button class="circle" onclick="cameraOpen()">📹</button>
      <button class="circle" onclick="uploadOpen()">⬆️</button>
    </div>

  </div>

  <div class="nav">
    <button onclick="home()">🏠 홈</button>
    <button onclick="favorites()">⭐ 즐겨찾기</button>
    <button onclick="showAllChannels()">👨‍👩‍👧‍👦 채널</button>
    <button onclick="channelOpen()">➕ 채널 만들기</button>
  </div>
</header>

<main>

  <section class="hero">
    <h1>🎵 HARMONY</h1>
    <p>우리 가족이 함께 만드는 영상 공간</p>

    <div class="actions">
      <button class="primary" onclick="cameraOpen()">📹 동영상 찍기</button>
      <button class="secondary" onclick="uploadOpen()">⬆️ 동영상 올리기</button>
      <button class="secondary" onclick="channelOpen()">➕ 채널 만들기</button>
    </div>
  </section>

  <section>
    <div class="title">
      <h2>👨‍👩‍👧‍👦 가족 채널</h2>
      <span id="channelCount" class="count"></span>
    </div>

    <div id="channels" class="channels"></div>
  </section>

  <section>
    <div class="title">
      <h2 id="videoTitle">🎬 최근 동영상</h2>
      <span id="videoCount" class="count"></span>
    </div>

    <div id="videos" class="videos"></div>
  </section>

</main>


<!-- 채널 만들기 -->
<div id="channelModal" class="modalBg">

  <div class="modal small">

    <div class="modalHead">
      <h2>➕ 채널 만들기</h2>
      <button class="close" onclick="closeModal('channelModal')">✕</button>
    </div>

    <div class="field">
      <label>채널 이름</label>
      <input id="channelName" placeholder="예: 유주의 만들기">
    </div>

    <div class="field">
      <label>채널 소개</label>
      <textarea id="channelDesc"
        placeholder="채널을 소개해 주세요."></textarea>
    </div>

    <div class="field">
      <label>아이콘</label>
      <select id="channelEmoji">
        <option>😊</option>
        <option>🐰</option>
        <option>🐱</option>
        <option>🐶</option>
        <option>🌈</option>
        <option>🎨</option>
        <option>🎮</option>
        <option>🎵</option>
      </select>
    </div>

    <div class="modalButtons">
      <button class="secondary"
        onclick="closeModal('channelModal')">취소</button>

      <button class="primary"
        onclick="createChannel()">만들기</button>
    </div>

  </div>
</div>


<!-- 업로드 -->
<div id="uploadModal" class="modalBg">

  <div class="modal">

    <div class="modalHead">
      <h2>⬆️ 동영상 올리기</h2>
      <button class="close"
        onclick="closeModal('uploadModal')">✕</button>
    </div>

    <div class="field">
      <label>동영상</label>
      <input id="videoFile"
        type="file"
        accept="video/*"
        onchange="previewVideo()">
    </div>

    <div id="preview"></div>

    <div class="field">
      <label>제목</label>
      <input id="videoName" placeholder="동영상 제목">
    </div>

    <div class="field">
      <label>설명</label>
      <textarea id="videoDesc"
        placeholder="동영상 설명"></textarea>
    </div>

    <div class="field">
      <label>채널</label>
      <select id="videoChannel"></select>
    </div>

    <div class="modalButtons">
      <button class="secondary"
        onclick="closeModal('uploadModal')">취소</button>

      <button class="primary"
        onclick="upload()">올리기</button>
    </div>

  </div>
</div>


<!-- 카메라 -->
<div id="cameraModal" class="modalBg">

  <div class="modal">

    <div class="modalHead">
      <h2>📹 동영상 찍기</h2>
      <button class="close" onclick="cameraClose()">✕</button>
    </div>

    <video id="camera" autoplay muted playsinline></video>

    <div class="actions" style="justify-content:center;margin-top:12px">

      <button id="recordStart"
        class="primary"
        onclick="recordStart()">🔴 녹화 시작</button>

      <button id="recordStop"
        class="secondary"
        onclick="recordStop()"
        disabled>⏹ 녹화 끝내기</button>

    </div>

    <div id="recordResult"></div>

  </div>
</div>


<!-- 영상 보기 -->
<div id="viewerModal" class="modalBg">

  <div class="modal viewer">

    <div class="modalHead">
      <h2>🎬 HARMONY</h2>
      <button class="close"
        onclick="closeModal('viewerModal')">✕</button>
    </div>

    <div id="viewer"></div>

  </div>
</div>


<div id="toast" class="toast"></div>


<script>
const CK="harmony_channels";
const VK="harmony_videos";
const FK="harmony_favorites";

let channels=[];
let videos=[];
let fav=[];
let stream=null;
let recorder=null;
let chunks=[];
let recorded=null;

function load(){
  try{
    channels=JSON.parse(localStorage.getItem(CK)||"[]");
    videos=JSON.parse(localStorage.getItem(VK)||"[]");
    fav=JSON.parse(localStorage.getItem(FK)||"[]");
  }catch(e){
    channels=[];
    videos=[];
    fav=[];
  }

  if(!Array.isArray(channels))channels=[];
  if(!Array.isArray(videos))videos=[];
  if(!Array.isArray(fav))fav=[];
}

function save(){
  localStorage.setItem(CK,JSON.stringify(channels));
  localStorage.setItem(VK,JSON.stringify(videos));
  localStorage.setItem(FK,JSON.stringify(fav));
}

function esc(x){
  return String(x??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function color(id){
  let n=0;
  for(let i=0;i<id.length;i++)n=id.charCodeAt(i)+((n<<5)-n);
  const c=[
    "#7c3aed","#db2777","#2563eb",
    "#059669","#ea580c","#0891b2"
  ];
  return c[Math.abs(n)%c.length];
}

function toast(t){
  const x=document.getElementById("toast");
  x.textContent=t;
  x.classList.add("show");
  clearTimeout(window.tt);
  window.tt=setTimeout(()=>x.classList.remove("show"),2200);
}

function closeModal(id){
  document.getElementById(id).classList.remove("show");
}

function home(){
  document.getElementById("search").value="";
  document.getElementById("videoTitle").textContent="🎬 최근 동영상";
  renderChannels();
  renderVideos(videos);
}

function channelOpen(){
  document.getElementById("channelName").value="";
  document.getElementById("channelDesc").value="";
  document.getElementById("channelEmoji").value="😊";
  document.getElementById("channelModal").classList.add("show");
}

function createChannel(){

  const name=document.getElementById("channelName").value.trim();

  if(!name){
    toast("채널 이름을 입력해 주세요.");
    return;
  }

  if(channels.some(x=>x.name===name)){
    toast("같은 이름의 채널이 있어요.");
    return;
  }

  channels.push({
    id:Date.now().toString(),
    name:name,
    desc:document.getElementById("channelDesc").value.trim()
      || "HARMONY 가족 채널",
    emoji:document.getElementById("channelEmoji").value
  });

  save();
  closeModal("channelModal");
  renderChannels();
  updateChannelSelect();

  toast("🎉 채널이 만들어졌어요!");
}

function renderChannels(){

  const box=document.getElementById("channels");

  document.getElementById("channelCount").textContent=
    channels.length+"개";

  if(!channels.length){

    box.innerHTML=`
      <div class="empty">
        <div style="font-size:45px">👨‍👩‍👧‍👦</div>
        <b>아직 채널이 없어요.</b>
        <p>가족의 채널을 만들어 보세요!</p>
        <button class="primary" onclick="channelOpen()">
          ➕ 첫 채널 만들기
        </button>
      </div>`;

    return;
  }

  box.innerHTML=channels.map(c=>{

    const count=videos.filter(v=>v.channelId===c.id).length;

    return `
      <div class="channel">

        <div class="avatar"
          style="background:${color(c.id)}">
          ${esc(c.emoji)}
        </div>

        <div class="channelName">${esc(c.name)}</div>

        <div class="channelDesc">
          ${esc(c.desc)}
          <br>동영상 ${count}개
        </div>

        <button onclick="openChannel('${c.id}')">
          채널 보기
        </button>

      </div>`;
  }).join("");
}

function openChannel(id){

  const c=channels.find(x=>x.id===id);
  if(!c)return;

  document.getElementById("videoTitle").textContent=
    c.emoji+" "+c.name;

  renderVideos(videos.filter(v=>v.channelId===id));
}

function showAllChannels(){
  renderChannels();
  renderVideos(videos);
}

function renderVideos(list){

  const box=document.getElementById("videos");

  document.getElementById("videoCount").textContent=
    list.length+"개";

  if(!list.length){

    box.innerHTML=`
      <div class="empty">
        <div style="font-size:45px">🎬</div>
        <b>아직 동영상이 없어요.</b>
        <p>첫 번째 동영상을 올려 보세요!</p>
        <button class="primary" onclick="uploadOpen()">
          ⬆️ 동영상 올리기
        </button>
      </div>`;

    return;
  }

  list=list.slice().sort(
    (a,b)=>new Date(b.date)-new Date(a.date)
  );

  box.innerHTML=list.map(v=>{

    const c=channels.find(x=>x.id===v.channelId);
    const favorite=fav.includes(v.id);

    return `
      <article class="videoCard">

        <div class="thumb" onclick="view('${v.id}')">
          ${
            v.data
            ? `<video src="${v.data}" preload="metadata"></video>`
            : `<div class="placeholder">🎬</div>`
          }
        </div>

        <div class="videoInfo">

          <div class="mini"
            style="background:${color(v.channelId)}">
            ${c?esc(c.emoji):"🎵"}
          </div>

          <div style="min-width:0">
            <div class="videoTitle">${esc(v.title)}</div>

            <div class="meta">
              ${c?esc(c.name):"HARMONY"}
              <br>
              ❤️ ${v.likes||0}
              · 💬 ${(v.comments||[]).length}
            </div>
          </div>

        </div>

        <div class="videoButtons">

          <button onclick="like('${v.id}')">
            ❤️ ${v.likes||0}
          </button>

          <button
            class="${favorite?'active':''}"
            onclick="favorite('${v.id}')">
            ⭐
          </button>

          <button onclick="view('${v.id}')">
            💬
          </button>

        </div>

      </article>`;
  }).join("");
}

function updateChannelSelect(){

  const s=document.getElementById("videoChannel");

  s.innerHTML=channels.map(c=>`
    <option value="${c.id}">
      ${esc(c.emoji)} ${esc(c.name)}
    </option>
  `).join("");
}

function uploadOpen(){

  if(!channels.length){
    toast("먼저 채널을 만들어 주세요.");
    channelOpen();
    return;
  }

  document.getElementById("videoFile").value="";
  document.getElementById("videoName").value="";
  document.getElementById("videoDesc").value="";
  document.getElementById("preview").innerHTML="";

  updateChannelSelect();

  document.getElementById("uploadModal")
    .classList.add("show");
}

function previewVideo(){

  const file=document.getElementById("videoFile").files[0];

  if(!file)return;

  const url=URL.createObjectURL(file);

  document.getElementById("preview").innerHTML=`
    <video src="${url}" controls
      style="width:100%;max-height:300px;border-radius:12px;
      margin-bottom:13px;background:#111">
    </video>`;
}

function upload(){

  const file=document.getElementById("videoFile").files[0];
  const title=document.getElementById("videoName").value.trim();

  if(!file){
    toast("동영상 파일을 선택해 주세요.");
    return;
  }

  if(!title){
    toast("동영상 제목을 입력해 주세요.");
    return;
  }

  if(file.size>5*1024*1024){
    toast("현재 버전은 5MB 이하 영상을 권장해요.");
    return;
  }

  const reader=new FileReader();

  reader.onload=e=>{

    videos.push({
      id:Date.now().toString(),
      title:title,
      desc:document.getElementById("videoDesc").value.trim(),
      channelId:document.getElementById("videoChannel").value,
      data:e.target.result,
      likes:0,
      comments:[],
      date:new Date().toISOString()
    });

    save();
    closeModal("uploadModal");
    renderChannels();
    renderVideos(videos);

    toast("🎉 HARMONY에 동영상이 올라갔어요!");
  };

  reader.readAsDataURL(file);
}

async function cameraOpen(){

  if(!channels.length){
    toast("먼저 채널을 만들어 주세요.");
    channelOpen();
    return;
  }

  document.getElementById("cameraModal")
    .classList.add("show");

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

    document.getElementById("camera").srcObject=stream;

  }catch(e){

    toast("카메라 권한을 확인해 주세요.");

  }
}

function cameraClose(){

  if(recorder && recorder.state!=="inactive"){
    recorder.stop();
  }

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  closeModal("cameraModal");
}

function recordStart(){

  if(!stream){
    toast("카메라가 준비되지 않았어요.");
    return;
  }

  chunks=[];

  try{
    recorder=new MediaRecorder(stream);
  }catch(e){
    toast("이 브라우저에서는 녹화를 사용할 수 없어요.");
    return;
  }

  recorder.ondataavailable=e=>{
    if(e.data.size)chunks.push(e.data);
  };

  recorder.onstop=()=>{

    recorded=new Blob(chunks,{type:"video/webm"});

    const url=URL.createObjectURL(recorded);

    document.getElementById("recordResult").innerHTML=`
      <div style="margin-top:15px">
        <b>🎉 녹화 완료!</b>

        <video src="${url}" controls
          style="width:100%;margin-top:10px;border-radius:12px">
        </video>

        <button class="primary"
          style="margin-top:10px"
          onclick="recordUpload()">
          ⬆️ 이 영상 올리기
        </button>
      </div>`;
  };

  recorder.start();

  document.getElementById("recordStart").disabled=true;
  document.getElementById("recordStop").disabled=false;
}

function recordStop(){

  if(recorder && recorder.state!=="inactive"){
    recorder.stop();
  }

  document.getElementById("recordStart").disabled=false;
  document.getElementById("recordStop").disabled=true;
}

function recordUpload(){

  if(!recorded)return;

  cameraClose();
  uploadOpen();

  setTimeout(()=>{

    const file=new File(
      [recorded],
      "harmony-video.webm",
      {type:"video/webm"}
    );

    const dt=new DataTransfer();
    dt.items.add(file);

    document.getElementById("videoFile").files=dt.files;

    document.getElementById("videoName").value=
      "HARMONY에서 찍은 영상";

    previewVideo();

  },150);
}

function like(id){

  const v=videos.find(x=>x.id===id);
  if(!v)return;

  v.likes=(v.likes||0)+1;

  save();
  renderVideos(videos);

  toast("❤️ 좋아요!");
}

function favorite(id){

  const i=fav.indexOf(id);

  if(i<0){
    fav.push(id);
    toast("⭐ 즐겨찾기에 추가했어요!");
  }else{
    fav.splice(i,1);
    toast("즐겨찾기에서 삭제했어요.");
  }

  save();
  renderVideos(videos);
}

function favorites(){

  document.getElementById("videoTitle").textContent=
    "⭐ 즐겨찾기";

  renderVideos(
    videos.filter(v=>fav.includes(v.id))
  );
}

function searchVideos(){

  const q=document.getElementById("search")
    .value.trim().toLowerCase();

  if(!q){
    home();
    return;
  }

  const result=videos.filter(v=>{

    const c=channels.find(x=>x.id===v.channelId);

    return [
      v.title,
      v.desc,
      c?c.name:""
    ].join(" ").toLowerCase().includes(q);

  });

  document.getElementById("videoTitle").textContent=
    "🔍 \""+q+"\" 검색 결과";

  renderVideos(result);
}

function view(id){

  const v=videos.find(x=>x.id===id);
  if(!v)return;

  const c=channels.find(x=>x.id===v.channelId);

  document.getElementById("viewer").innerHTML=`

    ${
      v.data
      ? `<video src="${v.data}" controls playsinline></video>`
      : `<div class="placeholder"
          style="height:350px;border-radius:14px">
          🎬
        </div>`
    }

    <div class="viewerTitle">
      ${esc(v.title)}
    </div>

    <div class="meta">
      ${c?esc(c.name):"HARMONY"}
    </div>

    <div class="actions" style="margin-top:12px">

      <button class="secondary"
        onclick="like('${v.id}');view('${v.id}')">
        ❤️ ${v.likes||0}
      </button>

      <button class="secondary"
        onclick="favorite('${v.id}');view('${v.id}')">
        ⭐ 즐겨찾기
      </button>

    </div>

    ${
      v.desc
      ? `<div style="background:#f5f5f7;border-radius:12px;
          padding:12px;margin-top:12px;white-space:pre-wrap">
          ${esc(v.desc)}
        </div>`
      : ""
    }

    <div class="comments">

      <h3>💬 댓글 ${(v.comments||[]).length}</h3>

      <div class="commentForm">

        <input id="comment"
          placeholder="댓글을 남겨 보세요."
          onkeydown="
            if(event.key==='Enter')addComment('${v.id}')
          ">

        <button onclick="addComment('${v.id}')">
          등록
        </button>

      </div>

      <div>
        ${
          (v.comments||[]).length
          ?
          v.comments.slice().reverse().map(c=>`
            <div class="comment">
              <b>${esc(c.name)}</b>
              <div>${esc(c.text)}</div>
            </div>
          `).join("")
          :
          `<p style="color:#888">첫 댓글을 남겨 보세요! 😊</p>`
        }
      </div>

    </div>
  `;

  document.getElementById("viewerModal")
    .classList.add("show");
}

function addComment(id){

  const input=document.getElementById("comment");
  if(!input)return;

  const text=input.value.trim();

  if(!text){
    toast("댓글을 입력해 주세요.");
    return;
  }

  const v=videos.find(x=>x.id===id);
  if(!v)return;

  if(!v.comments)v.comments=[];

  v.comments.push({
    name:"가족",
    text:text,
    date:new Date().toISOString()
  });

  save();
  view(id);

  toast("💬 댓글이 등록됐어요!");
}

document.querySelectorAll(".modalBg").forEach(x=>{

  x.addEventListener("click",e=>{

    if(e.target===x){

      if(x.id==="cameraModal"){
        cameraClose();
      }else{
        closeModal(x.id);
      }

    }
  });

});

load();
renderChannels();
renderVideos(videos);
</script>

</body>
</html>
