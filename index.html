<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARMONY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans KR",sans-serif;
    background:#f6f7fb;
    color:#202124;
}

header{
    height:70px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:15px;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
}

.search{
    flex:1;
    max-width:600px;
    margin:auto;
    display:flex;
}

.search input{
    width:100%;
    padding:13px 17px;
    border:1px solid #ddd;
    border-radius:25px 0 0 25px;
    font-size:15px;
    outline:none;
}

.search button{
    border:0;
    padding:0 20px;
    border-radius:0 25px 25px 0;
    background:#222;
    color:white;
    cursor:pointer;
}

.header-btn{
    border:0;
    background:#f1f3f5;
    padding:10px 14px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
}

.notification{
    position:relative;
}

.badge{
    position:absolute;
    top:-5px;
    right:-5px;
    min-width:19px;
    height:19px;
    background:#ff3b30;
    color:white;
    border-radius:50%;
    font-size:11px;
    display:none;
    align-items:center;
    justify-content:center;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:22px;
}

.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
}

.nav button{
    border:0;
    background:white;
    padding:12px 17px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.nav button.active{
    background:#222;
    color:white;
}

.page{display:none}
.page.active{display:block}

.hero{
    background:white;
    border-radius:22px;
    padding:30px;
    margin-bottom:22px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.hero h1{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:18px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.thumb{
    width:100%;
    aspect-ratio:16/9;
    background:#e9ecf2;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.thumb video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.card-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:7px;
}

.muted{
    color:#777;
    font-size:13px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

button{
    font-family:inherit;
}

.primary{
    border:0;
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.secondary{
    border:1px solid #ddd;
    background:white;
    padding:11px 16px;
    border-radius:12px;
    cursor:pointer;
}

.danger{
    background:#ff3b30;
    color:white;
    border:0;
}

.form{
    background:white;
    padding:22px;
    border-radius:20px;
    max-width:650px;
    margin:auto;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.form h2{
    margin-top:0;
}

.form input,
.form textarea,
.form select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    margin:7px 0 14px;
    font-size:15px;
    outline:none;
}

.form textarea{
    min-height:110px;
    resize:vertical;
}

.channel-card{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.channel-avatar{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#222;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:12px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:22px;
    padding:22px;
}

.close{
    float:right;
    border:0;
    background:#eee;
    border-radius:50%;
    width:35px;
    height:35px;
    cursor:pointer;
}

.video-player video{
    width:100%;
    max-height:500px;
    background:#000;
    border-radius:15px;
}

.comment{
    border-top:1px solid #eee;
    padding:12px 0;
}

.notification-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.notice{
    background:white;
    padding:16px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.notice.unread{
    border-left:5px solid #222;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.progress{
    height:8px;
    background:#eee;
    border-radius:10px;
    overflow:hidden;
    margin:10px 0;
}

.progress-bar{
    height:100%;
    width:0;
    background:#222;
    transition:.2s;
}

@media(max-width:700px){
    header{
        flex-wrap:wrap;
        height:auto;
        padding:12px;
    }

    .search{
        order:3;
        width:100%;
        max-width:none;
    }

    .container{
        padding:13px;
    }

    .hero{
        padding:22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo" onclick="showPage('home')">🎬 HARMONY</div>

    <div class="search">
        <input id="searchInput" placeholder="동영상이나 채널 검색">
        <button onclick="searchAll()">검색</button>
    </div>

    <button class="header-btn notification" onclick="showPage('notifications')">
        🔔
        <span id="notificationBadge" class="badge">0</span>
    </button>

    <button class="header-btn" onclick="showPage('createChannel')">➕ 채널</button>
</header>

<div class="container">

    <div class="nav">
        <button id="navHome" class="active" onclick="showPage('home')">🏠 홈</button>
        <button id="navVideos" onclick="showPage('videos')">🎬 동영상</button>
        <button id="navChannels" onclick="showPage('channels')">📺 채널</button>
        <button id="navFavorites" onclick="showPage('favorites')">⭐ 즐겨찾기</button>
        <button id="navCreate" onclick="showPage('createChannel')">➕ 채널 만들기</button>
        <button id="navUpload" onclick="showPage('upload')">⬆️ 동영상 올리기</button>
        <button id="navCamera" onclick="showPage('camera')">📹 동영상 찍기</button>
        <button id="navNotifications" onclick="showPage('notifications')">🔔 알림</button>
    </div>

    <!-- HOME -->
    <section id="home" class="page active">
        <div class="hero">
            <h1>🎬 HARMONY</h1>
            <p>가족끼리 자유롭게 채널을 만들고 동영상을 공유해요.</p>

            <div class="actions">
                <button class="primary" onclick="showPage('createChannel')">
                    ➕ 내 채널 만들기
                </button>

                <button class="secondary" onclick="showPage('upload')">
                    ⬆️ 동영상 올리기
                </button>

                <button class="secondary" onclick="showPage('camera')">
                    📹 동영상 찍기
                </button>
            </div>
        </div>

        <h2>🔥 최신 동영상</h2>
        <div id="homeVideos" class="grid"></div>
    </section>

    <!-- VIDEOS -->
    <section id="videos" class="page">
        <h2>🎬 모든 동영상</h2>
        <div id="videoGrid" class="grid"></div>
    </section>

    <!-- CHANNELS -->
    <section id="channels" class="page">
        <h2>📺 채널</h2>

        <div class="actions">
            <button class="primary" onclick="showPage('createChannel')">
                ➕ 채널 만들기
            </button>
        </div>

        <br>

        <div id="channelGrid" class="grid"></div>
    </section>

    <!-- CREATE CHANNEL -->
    <section id="createChannel" class="page">
        <div class="form">
            <h2>➕ 채널 만들기</h2>

            <label>채널 이름</label>
            <input id="channelName" placeholder="예: 유주의 만들기 채널">

            <label>채널 소개</label>
            <textarea id="channelDescription" placeholder="내 채널을 소개해 주세요."></textarea>

            <label>만든 사람</label>
            <input id="channelOwner" placeholder="이름을 입력하세요">

            <button class="primary" onclick="createChannel()">
                🎉 채널 만들기
            </button>
        </div>
    </section>

    <!-- UPLOAD -->
    <section id="upload" class="page">
        <div class="form">
            <h2>⬆️ 동영상 올리기</h2>

            <label>채널</label>
            <select id="uploadChannel"></select>

            <label>동영상 제목</label>
            <input id="videoTitle" placeholder="동영상 제목">

            <label>설명</label>
            <textarea id="videoDescription" placeholder="동영상 설명"></textarea>

            <label>올리는 사람</label>
            <input id="videoOwner" placeholder="이름">

            <label>동영상 파일</label>
            <input id="videoFile" type="file" accept="video/*">

            <p class="muted">
                ⏱️ 최대 30분까지 업로드할 수 있어요.
            </p>

            <div class="progress">
                <div id="uploadProgress" class="progress-bar"></div>
            </div>

            <button class="primary" onclick="uploadVideo()">
                🚀 동영상 업로드
            </button>

            <p id="uploadStatus" class="muted"></p>
        </div>
    </section>

    <!-- CAMERA -->
    <section id="camera" class="page">
        <div class="form">
            <h2>📹 동영상 찍기</h2>

            <video id="cameraPreview" autoplay muted playsinline
                   style="width:100%;border-radius:15px;background:#111;"></video>

            <div class="actions">
                <button class="primary" onclick="startCamera()">카메라 시작</button>
                <button class="primary" onclick="startRecording()">🔴 촬영 시작</button>
                <button class="secondary" onclick="stopRecording()">⏹ 촬영 종료</button>
            </div>

            <p id="cameraStatus" class="muted"></p>

            <div id="recordedArea"></div>
        </div>
    </section>

    <!-- FAVORITES -->
    <section id="favorites" class="page">
        <h2>⭐ 즐겨찾기</h2>
        <div id="favoriteGrid" class="grid"></div>
    </section>

    <!-- NOTIFICATIONS -->
    <section id="notifications" class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h2>🔔 새로운 소식</h2>
            <button class="secondary" onclick="markNotificationsRead()">
                모두 읽음
            </button>
        </div>

        <div id="notificationList" class="notification-list"></div>
    </section>

</div>

<!-- VIDEO MODAL -->
<div id="videoModal" class="modal">
    <div class="modal-box">
        <button class="close" onclick="closeVideo()">×</button>

        <div id="videoDetail"></div>

        <h3>💬 댓글</h3>

        <input id="commentAuthor"
               placeholder="이름"
               style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;">

        <textarea id="commentText"
                  placeholder="댓글을 입력하세요"
                  style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;min-height:80px;"></textarea>

        <button class="primary" onclick="addComment()">
            댓글 남기기
        </button>

        <div id="comments"></div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://iunngbsdbvwpcgayluns.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ry5rF5t2eTVxLiBdJQmAKA_y1T2lzrT";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let channels = [];
let videos = [];
let favorites = [];
let notifications = [];
let currentVideo = null;

let cameraStream = null;
let mediaRecorder = null;
let recordedChunks = [];

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function showPage(page){
    document.querySelectorAll(".page").forEach(p=>{
        p.classList.remove("active");
    });

    const target = document.getElementById(page);

    if(target){
        target.classList.add("active");
    }

    document.querySelectorAll(".nav button").forEach(b=>{
        b.classList.remove("active");
    });

    if(page==="home") document.getElementById("navHome").classList.add("active");
    if(page==="videos") document.getElementById("navVideos").classList.add("active");
    if(page==="channels") document.getElementById("navChannels").classList.add("active");
    if(page==="favorites") document.getElementById("navFavorites").classList.add("active");
    if(page==="createChannel") document.getElementById("navCreate").classList.add("active");
    if(page==="upload") document.getElementById("navUpload").classList.add("active");
    if(page==="camera") document.getElementById("navCamera").classList.add("active");
    if(page==="notifications") document.getElementById("navNotifications").classList.add("active");

    if(page==="upload"){
        loadUploadChannels();
    }

    if(page==="notifications"){
        loadNotifications();
    }
}

async function loadAll(){
    try{
        const channelResult = await supabaseClient
            .from("channels")
            .select("*")
            .order("created_at",{ascending:false});

        if(channelResult.error) throw channelResult.error;

        channels = channelResult.data || [];

        const videoResult = await supabaseClient
            .from("videos")
            .select("*")
            .order("created_at",{ascending:false});

        if(videoResult.error) throw videoResult.error;

        videos = videoResult.data || [];

        const favoriteResult = await supabaseClient
            .from("favorites")
            .select("*")
            .order("created_at",{ascending:false});

        if(!favoriteResult.error){
            favorites = favoriteResult.data || [];
        }

        renderAll();
        loadNotifications();

    }catch(error){
        console.error(error);

        document.getElementById("homeVideos").innerHTML =
            '<div class="empty">Supabase 연결을 확인해주세요.</div>';
    }
}

function renderAll(){
    renderVideos(videos,"homeVideos");
    renderVideos(videos,"videoGrid");
    renderChannels();
    renderFavorites();
    loadUploadChannels();
}

function channelName(channelId){
    const channel = channels.find(c=>String(c.id)===String(channelId));
    return channel ? channel.name : "알 수 없는 채널";
}

function renderVideos(list,targetId){
    const target = document.getElementById(targetId);

    if(!target) return;

    if(!list.length){
        target.innerHTML = '<div class="empty">아직 동영상이 없어요 🎬</div>';
        return;
    }

    target.innerHTML = list.map(video=>{
        return `
        <div class="card">
            <div class="thumb">
                <video src="${escapeHTML(video.video_url)}" muted preload="metadata"></video>
            </div>

            <div class="card-body">
                <div class="card-title">${escapeHTML(video.title)}</div>

                <div class="muted">
                    📺 ${escapeHTML(channelName(video.channel_id))}
                </div>

                <div class="muted">
                    👤 ${escapeHTML(video.owner || "사용자")}
                </div>

                <div class="actions">
                    <button class="primary"
                            onclick="openVideo(${video.id})">
                        ▶️ 보기
                    </button>

                    <button class="secondary"
                            onclick="toggleFavorite(${video.id})">
                        ⭐
                    </button>
                </div>
            </div>
        </div>
        `;
    }).join("");
}

function renderChannels(){
    const target = document.getElementById("channelGrid");

    if(!channels.length){
        target.innerHTML = `
        <div class="empty">
            아직 채널이 없어요.<br><br>
            <button class="primary" onclick="showPage('createChannel')">
                ➕ 첫 번째 채널 만들기
            </button>
        </div>`;
        return;
    }

    target.innerHTML = channels.map(channel=>{
        const count = videos.filter(v=>
            String(v.channel_id)===String(channel.id)
        ).length;

        const first = (channel.name || "?").charAt(0);

        return `
        <div class="channel-card">
            <div class="channel-avatar">${escapeHTML(first)}</div>

            <h3>${escapeHTML(channel.name)}</h3>

            <p>${escapeHTML(channel.description || "채널 소개가 없습니다.")}</p>

            <div class="muted">
                👤 ${escapeHTML(channel.owner || "사용자")}
            </div>

            <div class="muted">
                🎬 동영상 ${count}개
            </div>

            <div class="actions">
                <button class="primary"
                        onclick="openChannel(${channel.id})">
                    채널 보기
                </button>
            </div>
        </div>
        `;
    }).join("");
}

function renderFavorites(){
    const target = document.getElementById("favoriteGrid");

    const list = videos.filter(v=>
        favorites.some(f=>String(f.video_id)===String(v.id))
    );

    renderVideos(list,"favoriteGrid");
}

async function createChannel(){
    const name = document.getElementById("channelName").value.trim();
    const description = document.getElementById("channelDescription").value.trim();
    const owner = document.getElementById("channelOwner").value.trim();

    if(!name){
        alert("채널 이름을 입력해주세요.");
        return;
    }

    try{
        const {data,error} = await supabaseClient
            .from("channels")
            .insert({
                name,
                description,
                owner: owner || "사용자"
            })
            .select()
            .single();

        if(error) throw error;

        await createNotification(
            "channel",
            "새 채널이 만들어졌어요 📺",
            `${name} 채널이 HARMONY에 만들어졌어요.`,
            data.id
        );

        alert("🎉 채널이 만들어졌어요!");

        document.getElementById("channelName").value="";
        document.getElementById("channelDescription").value="";
        document.getElementById("channelOwner").value="";

        await loadAll();
        showPage("channels");

    }catch(error){
        console.error(error);
        alert("채널 만들기에 실패했어요.\n\n"+error.message);
    }
}

function loadUploadChannels(){
    const select = document.getElementById("uploadChannel");

    if(!select) return;

    if(!channels.length){
        select.innerHTML = '<option value="">먼저 채널을 만들어 주세요</option>';
        return;
    }

    select.innerHTML = channels.map(c=>
        `<option value="${c.id}">${escapeHTML(c.name)}</option>`
    ).join("");
}

async function uploadVideo(){
    const channelId = document.getElementById("uploadChannel").value;
    const title = document.getElementById("videoTitle").value.trim();
    const description = document.getElementById("videoDescription").value.trim();
    const owner = document.getElementById("videoOwner").value.trim();
    const file = document.getElementById("videoFile").files[0];

    const status = document.getElementById("uploadStatus");
    const progress = document.getElementById("uploadProgress");

    if(!channelId){
        alert("채널을 먼저 만들어 주세요.");
        return;
    }

    if(!title){
        alert("동영상 제목을 입력해주세요.");
        return;
    }

    if(!file){
        alert("동영상 파일을 선택해주세요.");
        return;
    }

    status.textContent="동영상 길이를 확인하는 중...";
    progress.style.width="5%";

    try{
        const duration = await getVideoDuration(file);

        if(duration > 1800){
            status.textContent="";
            progress.style.width="0%";
            alert("동영상은 최대 30분까지 올릴 수 있어요.");
            return;
        }

        progress.style.width="15%";
        status.textContent="Storage에 업로드하는 중...";

        const safeName = file.name
            .replace(/[^\w.\-가-힣]/g,"_");

        const filePath =
            Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+safeName;

        const {error:uploadError} = await supabaseClient
            .storage
            .from("videos")
            .upload(filePath,file,{
                cacheControl:"3600",
                upsert:false,
                contentType:file.type
            });

        if(uploadError) throw uploadError;

        progress.style.width="80%";

        const {data:urlData} =
            supabaseClient
            .storage
            .from("videos")
            .getPublicUrl(filePath);

        const videoUrl = urlData.publicUrl;

        status.textContent="동영상 정보를 저장하는 중...";

        const {data,error} = await supabaseClient
            .from("videos")
            .insert({
                channel_id:Number(channelId),
                title,
                description,
                video_url:videoUrl,
                duration:Math.round(duration),
                owner:owner || "사용자",
                likes:0
            })
            .select()
            .single();

        if(error) throw error;

        await createNotification(
            "video",
            "새 동영상이 올라왔어요 🎬",
            `${title} 동영상이 HARMONY에 올라왔어요.`,
            data.id
        );

        progress.style.width="100%";
        status.textContent="🎉 업로드 완료!";

        document.getElementById("videoTitle").value="";
        document.getElementById("videoDescription").value="";
        document.getElementById("videoOwner").value="";
        document.getElementById("videoFile").value="";

        await loadAll();

        setTimeout(()=>{
            progress.style.width="0%";
            status.textContent="";
            showPage("videos");
        },800);

    }catch(error){
        console.error(error);
        status.textContent="업로드 실패";
        progress.style.width="0%";

        alert(
            "동영상 업로드에 실패했어요.\n\n"+
            error.message+
            "\n\nSupabase Storage에 videos 버킷이 있는지 확인해주세요."
        );
    }
}

function getVideoDuration(file){
    return new Promise((resolve,reject)=>{
        const video=document.createElement("video");
        const url=URL.createObjectURL(file);

        video.preload="metadata";

        video.onloadedmetadata=()=>{
            URL.revokeObjectURL(url);
            resolve(video.duration);
        };

        video.onerror=()=>{
            URL.revokeObjectURL(url);
            reject(new Error("동영상 정보를 읽을 수 없습니다."));
        };

        video.src=url;
    });
}

async function openVideo(id){
    currentVideo = videos.find(v=>String(v.id)===String(id));

    if(!currentVideo) return;

    const modal=document.getElementById("videoModal");

    document.getElementById("videoDetail").innerHTML=`
        <h2>${escapeHTML(currentVideo.title)}</h2>

        <div class="video-player">
            <video controls autoplay src="${escapeHTML(currentVideo.video_url)}"></video>
        </div>

        <p>${escapeHTML(currentVideo.description || "")}</p>

        <p class="muted">
            📺 ${escapeHTML(channelName(currentVideo.channel_id))}
            · 👤 ${escapeHTML(currentVideo.owner || "사용자")}
        </p>

        <div class="actions">
            <button class="primary"
                    onclick="likeVideo(${currentVideo.id})">
                ❤️ 좋아요
            </button>

            <button class="secondary"
                    onclick="toggleFavorite(${currentVideo.id})">
                ⭐ 즐겨찾기
            </button>
        </div>
    `;

    modal.classList.add("show");

    await loadComments();
}

function closeVideo(){
    document.getElementById("videoModal").classList.remove("show");
    document.getElementById("videoDetail").innerHTML="";
    document.getElementById("comments").innerHTML="";
    currentVideo=null;
}

async function likeVideo(id){
    try{
        const video=videos.find(v=>String(v.id)===String(id));

        if(!video) return;

        const {error}=await supabaseClient
            .from("videos")
            .update({
                likes:(video.likes || 0)+1
            })
            .eq("id",id);

        if(error) throw error;

        await createNotification(
            "like",
            "좋아요 ❤️",
            `${video.title}에 좋아요가 추가됐어요.`,
            id
        );

        await loadAll();

        if(currentVideo){
            currentVideo.likes=(currentVideo.likes || 0)+1;
        }

        alert("❤️ 좋아요!");
    }catch(error){
        alert("좋아요에 실패했어요.\n"+error.message);
    }
}

async function toggleFavorite(id){
    const existing=favorites.find(f=>
        String(f.video_id)===String(id)
    );

    try{
        if(existing){
            const {error}=await supabaseClient
                .from("favorites")
                .delete()
                .eq("id",existing.id);

            if(error) throw error;
        }else{
            const {error}=await supabaseClient
                .from("favorites")
                .insert({
                    video_id:Number(id),
                    user_name:"사용자"
                });

            if(error) throw error;
        }

        await loadAll();

    }catch(error){
        alert("즐겨찾기 처리에 실패했어요.\n"+error.message);
    }
}

async function loadComments(){
    if(!currentVideo) return;

    const target=document.getElementById("comments");

    const {data,error}=await supabaseClient
        .from("comments")
        .select("*")
        .eq("video_id",currentVideo.id)
        .order("created_at",{ascending:false});

    if(error){
        target.innerHTML="<p>댓글을 불러오지 못했어요.</p>";
        return;
    }

    if(!data.length){
        target.innerHTML='<div class="empty">첫 댓글을 남겨보세요 💬</div>';
        return;
    }

    target.innerHTML=data.map(c=>`
        <div class="comment">
            <b>${escapeHTML(c.author)}</b>
            <p>${escapeHTML(c.text)}</p>
            <span class="muted">
                ${new Date(c.created_at).toLocaleString("ko-KR")}
            </span>
        </div>
    `).join("");
}

async function addComment(){
    if(!currentVideo) return;

    const author=document.getElementById("commentAuthor").value.trim();
    const text=document.getElementById("commentText").value.trim();

    if(!author || !text){
        alert("이름과 댓글을 입력해주세요.");
        return;
    }

    try{
        const {error}=await supabaseClient
            .from("comments")
            .insert({
                video_id:currentVideo.id,
                author,
                text
            });

        if(error) throw error;

        await createNotification(
            "comment",
            "새 댓글이 달렸어요 💬",
            `${currentVideo.title}에 새 댓글이 달렸어요.`,
            currentVideo.id
        );

        document.getElementById("commentText").value="";

        await loadComments();

    }catch(error){
        alert("댓글 등록에 실패했어요.\n"+error.message);
    }
}

function openChannel(id){
    const channel=channels.find(c=>String(c.id)===String(id));

    if(!channel) return;

    const list=videos.filter(v=>
        String(v.channel_id)===String(id)
    );

    const target=document.getElementById("homeVideos");

    showPage("home");

    target.innerHTML=`
        <div style="grid-column:1/-1">
            <div class="hero">
                <h2>📺 ${escapeHTML(channel.name)}</h2>
                <p>${escapeHTML(channel.description || "")}</p>
                <p class="muted">
                    👤 ${escapeHTML(channel.owner || "사용자")}
                    · 🎬 ${list.length}개
                </p>
            </div>
        </div>
    `;

    if(list.length){
        const wrapper=document.createElement("div");
        wrapper.className="grid";
        wrapper.style.gridColumn="1/-1";
        target.appendChild(wrapper);

        wrapper.innerHTML=list.map(video=>`
            <div class="card">
                <div class="thumb">
                    <video src="${escapeHTML(video.video_url)}"
                           muted
                           preload="metadata"></video>
                </div>
                <div class="card-body">
                    <div class="card-title">${escapeHTML(video.title)}</div>
                    <div class="actions">
                        <button class="primary"
                                onclick="openVideo(${video.id})">
                            ▶️ 보기
                        </button>
                    </div>
                </div>
            </div>
        `).join("");
    }
}

async function createNotification(type,title,message,relatedId){
    try{
        await supabaseClient
            .from("notifications")
            .insert({
                type,
                title,
                message,
                related_id:relatedId || null
            });
    }catch(error){
        console.warn("알림 저장 실패:",error);
    }
}

async function loadNotifications(){
    try{
        const {data,error}=await supabaseClient
            .from("notifications")
            .select("*")
            .order("created_at",{ascending:false})
            .limit(100);

        if(error) throw error;

        notifications=data || [];

        renderNotifications();

    }catch(error){
        console.warn("알림을 불러오지 못했습니다.",error);

        document.getElementById("notificationList").innerHTML=
            '<div class="empty">알림을 불러오지 못했어요.</div>';
    }
}

function renderNotifications(){
    const target=document.getElementById("notificationList");

    if(!notifications.length){
        target.innerHTML=
            '<div class="empty">새로운 소식이 없어요 🔔</div>';

        updateBadge(0);
        return;
    }

    target.innerHTML=notifications.map(n=>`
        <div class="notice unread">
            <b>${escapeHTML(n.title)}</b>
            <p>${escapeHTML(n.message)}</p>
            <span class="muted">
                ${new Date(n.created_at).toLocaleString("ko-KR")}
            </span>
        </div>
    `).join("");

    updateBadge(notifications.length);

    if("Notification" in window &&
       Notification.permission==="default"){
        Notification.requestPermission().catch(()=>{});
    }
}

function updateBadge(count){
    const badge=document.getElementById("notificationBadge");

    if(count>0){
        badge.style.display="flex";
        badge.textContent=count>99 ? "99+" : count;
    }else{
        badge.style.display="none";
    }
}

async function markNotificationsRead(){
    notifications=[];
    renderNotifications();
}

async function searchAll(){
    const q=document.getElementById("searchInput").value.trim().toLowerCase();

    if(!q){
        await loadAll();
        showPage("videos");
        return;
    }

    const videoResults=videos.filter(v=>
        String(v.title || "").toLowerCase().includes(q) ||
        String(v.description || "").toLowerCase().includes(q) ||
        String(v.owner || "").toLowerCase().includes(q)
    );

    const channelResults=channels.filter(c=>
        String(c.name || "").toLowerCase().includes(q) ||
        String(c.description || "").toLowerCase().includes(q) ||
        String(c.owner || "").toLowerCase().includes(q)
    );

    showPage("videos");

    const target=document.getElementById("videoGrid");

    let html="";

    if(channelResults.length){
        html+=`
        <div style="grid-column:1/-1">
            <h2>📺 채널 검색 결과</h2>
        </div>
        `;

        html+=channelResults.map(c=>`
            <div class="channel-card">
                <div class="channel-avatar">
                    ${escapeHTML((c.name || "?").charAt(0))}
                </div>
                <h3>${escapeHTML(c.name)}</h3>
                <p>${escapeHTML(c.description || "")}</p>
                <button class="primary"
                        onclick="openChannel(${c.id})">
                    채널 보기
                </button>
            </div>
        `).join("");
    }

    if(videoResults.length){
        html+=`
        <div style="grid-column:1/-1">
            <h2>🎬 동영상 검색 결과</h2>
        </div>
        `;

        html+=videoResults.map(v=>`
            <div class="card">
                <div class="thumb">
                    <video src="${escapeHTML(v.video_url)}"
                           muted
                           preload="metadata"></video>
                </div>

                <div class="card-body">
                    <div class="card-title">
                        ${escapeHTML(v.title)}
                    </div>

                    <div class="muted">
                        📺 ${escapeHTML(channelName(v.channel_id))}
                    </div>

                    <button class="primary"
                            onclick="openVideo(${v.id})">
                        ▶️ 보기
                    </button>
                </div>
            </div>
        `).join("");
    }

    if(!html){
        html='<div class="empty">검색 결과가 없어요 🔎</div>';
    }

    target.innerHTML=html;
}

async function startCamera(){
    try{
        cameraStream=await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:true
        });

        document.getElementById("cameraPreview").srcObject=cameraStream;

        document.getElementById("cameraStatus").textContent=
            "카메라가 준비됐어요.";
    }catch(error){
        alert("카메라를 사용할 수 없습니다.\n"+error.message);
    }
}

function startRecording(){
    if(!cameraStream){
        alert("먼저 카메라 시작을 눌러주세요.");
        return;
    }

    recordedChunks=[];

    try{
        mediaRecorder=new MediaRecorder(cameraStream);

        mediaRecorder.ondataavailable=e=>{
            if(e.data.size>0){
                recordedChunks.push(e.data);
            }
        };

        mediaRecorder.onstop=()=>{
            const blob=new Blob(recordedChunks,{
                type:"video/webm"
            });

            const url=URL.createObjectURL(blob);

            document.getElementById("recordedArea").innerHTML=`
                <h3>🎬 촬영한 동영상</h3>

                <video controls
                       src="${url}"
                       style="width:100%;border-radius:15px;"></video>

                <br><br>

                <button class="primary"
                        onclick="useRecordedVideo('${url}')">
                    ⬆️ 업로드 화면에서 사용
                </button>
            `;
        };

        mediaRecorder.start();

        document.getElementById("cameraStatus").textContent=
            "🔴 촬영 중...";

    }catch(error){
        alert("촬영을 시작할 수 없습니다.\n"+error.message);
    }
}

function stopRecording(){
    if(mediaRecorder && mediaRecorder.state!=="inactive"){
        mediaRecorder.stop();

        document.getElementById("cameraStatus").textContent=
            "촬영이 끝났어요.";
    }
}

function useRecordedVideo(url){
    showPage("upload");

    alert(
        "촬영한 동영상이 준비됐어요.\n"+
        "브라우저 보안 때문에 파일 선택창에서 직접 선택해야 하는 경우가 있어요."
    );
}

},30000);

loadAll();

   Notification.permission==="default"){
    setTimeout(()=>{
        Notification.requestPermission().catch(()=>{});
    },3000);
