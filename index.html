<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARMONY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f7f8fc;
  color:#202124;
}

header{
  height:70px;
  background:white;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:26px;
  font-weight:900;
  color:#675cff;
  cursor:pointer;
  letter-spacing:1px;
}

.search{
  flex:1;
  max-width:600px;
  display:flex;
}

.search input{
  width:100%;
  padding:13px 18px;
  border:1px solid #ddd;
  border-radius:25px;
  outline:none;
  font-size:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
  background:#675cff;
  color:white;
}

button:hover{
  opacity:.88;
}

.secondary{
  background:#eeeef5;
  color:#333;
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 80px;
}

.hero{
  background:linear-gradient(135deg,#7568ff,#9a91ff);
  color:white;
  border-radius:24px;
  padding:30px;
  margin-bottom:25px;
}

.hero h1{
  margin:0 0 8px;
  font-size:36px;
}

.hero p{
  margin:0 0 20px;
  opacity:.9;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:25px;
}

.tabs button{
  white-space:nowrap;
}

.section{
  margin-bottom:35px;
}

.section h2{
  margin-bottom:16px;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.thumb{
  width:100%;
  aspect-ratio:16/9;
  background:#ddd;
  object-fit:cover;
  display:block;
}

.card-body{
  padding:15px;
}

.card-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:8px;
}

.meta{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.actions button{
  padding:8px 11px;
  font-size:12px;
}

.channel-card{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  background:white;
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:25px;
}

.modal h2{
  margin-top:0;
}

label{
  display:block;
  margin-top:15px;
  font-weight:700;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:7px;
  font:inherit;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.form-buttons{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

video{
  width:100%;
  border-radius:15px;
  background:#111;
}

.comment{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.comment-name{
  font-weight:800;
}

.empty{
  background:white;
  padding:40px;
  border-radius:18px;
  text-align:center;
  color:#777;
}

.status{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:20px;
  font-size:12px;
  z-index:200;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  header{
    padding:0 12px;
    gap:8px;
  }

  .logo{
    font-size:21px;
  }

  header button{
    display:none;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:28px;
  }

  main{
    padding:18px 12px 60px;
  }

  .video-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo" onclick="showHome()">HARMONY</div>

  <div class="search">
    <input
      id="searchInput"
      placeholder="🔎 영상이나 채널 검색"
      oninput="searchVideos()"
    >
  </div>

  <button onclick="openChannelModal()">채널 만들기</button>
  <button onclick="openUploadModal()">＋ 업로드</button>
</header>

<main>

<section class="hero">
  <h1>🎵 HARMONY</h1>
  <p>우리 가족이 함께 만드는 영상 공간</p>

  <button onclick="openCameraModal()">📹 동영상 찍기</button>
  <button class="secondary" onclick="openUploadModal()">🎬 영상 올리기</button>
</section>

<div class="tabs">
  <button onclick="showHome()">🏠 홈</button>
  <button onclick="showVideos()">🎬 모든 영상</button>
  <button onclick="showChannels()">📺 채널</button>
  <button onclick="showFavorites()">⭐ 즐겨찾기</button>
</div>

<div id="app"></div>

</main>

<div id="status" class="status">HARMONY 준비 완료</div>

<!-- 채널 만들기 -->

<div class="modal-bg" id="channelModal">
<div class="modal">

<h2>📺 새 채널 만들기</h2>

<label>채널 이름</label>
<input id="channelName" placeholder="예: 유주의 만들기 채널">

<label>채널 소개</label>
<textarea id="channelDescription"
placeholder="내 채널을 소개해 주세요"></textarea>

<div class="form-buttons">
<button class="secondary" onclick="closeModal('channelModal')">취소</button>
<button onclick="createChannel()">채널 만들기</button>
</div>

</div>
</div>

<!-- 영상 업로드 -->

<div class="modal-bg" id="uploadModal">
<div class="modal">

<h2>🎬 영상 업로드</h2>

<label>영상 제목</label>
<input id="videoTitle" placeholder="영상 제목">

<label>설명</label>
<textarea id="videoDescription"
placeholder="영상 설명"></textarea>

<label>채널</label>
<select id="videoChannel"></select>

<label>영상 파일</label>
<input
  id="videoFile"
  type="file"
  accept="video/*"
  onchange="previewVideo()"
>

<div id="uploadPreview"></div>

<div class="form-buttons">
<button class="secondary" onclick="closeModal('uploadModal')">취소</button>
<button onclick="uploadVideo()">업로드</button>
</div>

</div>
</div>

<!-- 카메라 -->

<div class="modal-bg" id="cameraModal">
<div class="modal">

<h2>📹 동영상 찍기</h2>

<video id="cameraVideo" autoplay playsinline></video>

<div class="form-buttons">
<button class="secondary" onclick="stopCamera()">닫기</button>
<button onclick="startRecording()">🔴 녹화 시작</button>
<button onclick="stopRecording()">⏹️ 녹화 끝</button>
</div>

<div id="recordStatus"></div>

</div>
</div>

<!-- 영상 보기 -->

<div class="modal-bg" id="watchModal">
<div class="modal">

<h2 id="watchTitle"></h2>

<video id="watchVideo" controls></video>

<p id="watchDescription"></p>

<div class="actions">
<button onclick="likeCurrent()">❤️ 좋아요</button>
<button onclick="favoriteCurrent()">⭐ 즐겨찾기</button>
</div>

<hr>

<h3>💬 댓글</h3>

<input id="commentAuthor" placeholder="이름">
<textarea id="commentText" placeholder="댓글을 입력하세요"></textarea>

<button onclick="addComment()">댓글 작성</button>

<div id="comments"></div>

<div class="form-buttons">
<button class="secondary" onclick="closeModal('watchModal')">닫기</button>
</div>

</div>
</div>

<script>

const SUPABASE_URL = "여기에_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "여기에_PUBLISHABLE_또는_ANON_KEY";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const MAX_VIDEO_DURATION = 30 * 60;

let videos = [];
let channels = [];
let currentVideo = null;
let cameraStream = null;
let mediaRecorder = null;
let recordedChunks = [];

function status(text){
  document.getElementById("status").textContent = text;
}

async function loadAll(){

  try{

    const c = await sb
      .from("channels")
      .select("*")
      .order("created_at",{ascending:false});

    if(c.error) throw c.error;

    channels = c.data || [];

    const v = await sb
      .from("videos")
      .select("*, channels(name)")
      .order("created_at",{ascending:false});

    if(v.error) throw v.error;

    videos = v.data || [];

    renderHome();

  }catch(e){

    console.error(e);

    status("⚠️ Supabase 연결을 확인해 주세요");

    document.getElementById("app").innerHTML =
      `<div class="empty">
        <h2>Supabase 연결이 필요해요</h2>
        <p>index.html의 SUPABASE_URL과 SUPABASE_KEY를 확인해 주세요.</p>
      </div>`;
  }
}

function showHome(){
  renderHome();
}

function renderHome(){

  const app = document.getElementById("app");

  let html = `
    <section class="section">
      <h2>🎬 최신 영상</h2>
      <div class="video-grid">
  `;

  if(!videos.length){

    html += `
      <div class="empty">
        아직 영상이 없어요.<br><br>
        첫 번째 영상을 올려보세요! 🎥
      </div>
    `;

  }else{

    videos.slice(0,12).forEach(v=>{
      html += videoCard(v);
    });
  }

  html += `
      </div>
    </section>
  `;

  app.innerHTML = html;
}

function videoCard(v){

  const channelName =
    v.channels?.name || "채널 없음";

  return `
    <div class="card">

      <video
        class="thumb"
        src="${escapeAttr(v.video_url)}"
        preload="metadata"
      ></video>

      <div class="card-body">

        <div class="card-title">
          ${escapeHtml(v.title)}
        </div>

        <div class="meta">
          📺 ${escapeHtml(channelName)}
          · ❤️ ${v.likes || 0}
        </div>

        <div class="actions">
          <button onclick="watchVideo(${v.id})">
            ▶️ 보기
          </button>

          <button onclick="likeVideo(${v.id})">
            ❤️ 좋아요
          </button>

          <button onclick="favoriteVideo(${v.id})">
            ⭐ 저장
          </button>
        </div>

      </div>
    </div>
  `;
}

function showVideos(){

  document.getElementById("app").innerHTML = `
    <section class="section">
      <h2>🎬 모든 영상</h2>
      <div class="video-grid" id="allVideos"></div>
    </section>
  `;

  renderVideoList(videos);
}

function renderVideoList(list){

  const box = document.getElementById("allVideos");

  if(!box) return;

  if(!list.length){

    box.innerHTML =
      `<div class="empty">검색 결과가 없어요.</div>`;

    return;
  }

  box.innerHTML = list.map(videoCard).join("");
}

function searchVideos(){

  const q =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(!q){

    renderHome();

    return;
  }

  const result = videos.filter(v => {

    const channel =
      v.channels?.name || "";

    return (
      (v.title || "").toLowerCase().includes(q) ||
      (v.description || "").toLowerCase().includes(q) ||
      channel.toLowerCase().includes(q)
    );

  });

  document.getElementById("app").innerHTML = `
    <section class="section">
      <h2>🔎 검색 결과</h2>
      <div class="video-grid" id="allVideos"></div>
    </section>
  `;

  renderVideoList(result);
}

function showChannels(){

  let html = `
    <section class="section">
      <h2>📺 채널</h2>
      <div class="video-grid">
  `;

  if(!channels.length){

    html += `
      <div class="empty">
        아직 채널이 없어요.
      </div>
    `;

  }else{

    channels.forEach(c=>{

      const count =
        videos.filter(v=>v.channel_id === c.id).length;

      html += `
        <div class="channel-card">

          <h2>📺 ${escapeHtml(c.name)}</h2>

          <p>
            ${escapeHtml(c.description || "소개가 없습니다.")}
          </p>

          <p class="meta">
            🎬 영상 ${count}개
          </p>

          <button onclick="showChannelVideos(${c.id})">
            채널 보기
          </button>

        </div>
      `;

    });
  }

  html += `
      </div>
    </section>
  `;

  document.getElementById("app").innerHTML = html;
}

function showChannelVideos(id){

  const channel =
    channels.find(c=>c.id===id);

  const list =
    videos.filter(v=>v.channel_id===id);

  document.getElementById("app").innerHTML = `

    <section class="section">

      <h2>📺 ${escapeHtml(channel.name)}</h2>

      <p>${escapeHtml(channel.description || "")}</p>

      <div class="video-grid" id="allVideos"></div>

    </section>
  `;

  renderVideoList(list);
}

function showFavorites(){

  const saved =
    JSON.parse(
      localStorage.getItem("harmonyFavorites") || "[]"
    );

  const list =
    videos.filter(v=>saved.includes(v.id));

  document.getElementById("app").innerHTML = `

    <section class="section">

      <h2>⭐ 즐겨찾기</h2>

      <div class="video-grid" id="allVideos"></div>

    </section>
  `;

  renderVideoList(list);
}

function openChannelModal(){

  document.getElementById("channelModal").style.display="flex";

}

async function createChannel(){

  const name =
    document.getElementById("channelName").value.trim();

  const description =
    document
      .getElementById("channelDescription")
      .value.trim();

  if(!name){

    alert("채널 이름을 입력해 주세요.");

    return;
  }

  status("📺 채널을 만드는 중...");

  const {error} =
    await sb
      .from("channels")
      .insert({
        name,
        description
      });

  if(error){

    alert("채널 생성 실패: " + error.message);

    return;
  }

  closeModal("channelModal");

  document.getElementById("channelName").value="";
  document.getElementById("channelDescription").value="";

  status("✅ 채널이 만들어졌어요!");

  await loadAll();

  showChannels();
}

function openUploadModal(){

  if(!channels.length){

    alert("먼저 채널을 하나 만들어 주세요.");

    openChannelModal();

    return;
  }

  const select =
    document.getElementById("videoChannel");

  select.innerHTML =
    channels.map(c =>
      `<option value="${c.id}">
        ${escapeHtml(c.name)}
      </option>`
    ).join("");

  document.getElementById("uploadModal").style.display="flex";
}

function previewVideo(){

  const file =
    document.getElementById("videoFile").files[0];

  const box =
    document.getElementById("uploadPreview");

  if(!file){

    box.innerHTML="";

    return;
  }

  const url =
    URL.createObjectURL(file);

  box.innerHTML = `
    <p>🎥 영상 확인</p>
    <video id="previewPlayer" controls src="${url}"></video>
  `;

  const player =
    document.getElementById("previewPlayer");

  player.addEventListener("loadedmetadata",()=>{

    if(player.duration > MAX_VIDEO_DURATION){

      alert("⏰ 영상은 최대 30분까지 올릴 수 있어요.");

      document.getElementById("videoFile").value="";

      box.innerHTML="";

    }

  });

}

async function uploadVideo(){

  const file =
    document.getElementById("videoFile").files[0];

  const title =
    document.getElementById("videoTitle").value.trim();

  const description =
    document
      .getElementById("videoDescription")
      .value.trim();

  const channelId =
    document.getElementById("videoChannel").value;

  if(!file){

    alert("영상 파일을 선택해 주세요.");

    return;
  }

  if(!title){

    alert("영상 제목을 입력해 주세요.");

    return;
  }

  status("⏰ 영상 길이를 확인하는 중...");

  const duration =
    await getVideoDuration(file);

  if(duration > MAX_VIDEO_DURATION){

    alert(
      "⏰ 30분을 초과한 영상은 업로드할 수 없어요."
    );

    return;
  }

  status("☁️ 영상을 업로드하는 중...");

  const safeName =
    file.name
      .replace(/[^a-zA-Z0-9._-]/g,"_");

  const path =
    Date.now() + "_" + safeName;

  const upload =
    await sb.storage
      .from("videos")
      .upload(path,file,{
        cacheControl:"3600",
        upsert:false
      });

  if(upload.error){

    alert(
      "영상 업로드 실패:\n" +
      upload.error.message
    );

    return;
  }

  const publicData =
    sb.storage
      .from("videos")
      .getPublicUrl(path);

  const videoUrl =
    publicData.data.publicUrl;

  const insert =
    await sb
      .from("videos")
      .insert({
        channel_id:Number(channelId),
        title,
        description,
        video_url:videoUrl,
        duration:Math.floor(duration),
        likes:0
      });

  if(insert.error){

    alert(
      "영상 정보 저장 실패:\n" +
      insert.error.message
    );

    return;
  }

  document.getElementById("videoTitle").value="";
  document.getElementById("videoDescription").value="";
  document.getElementById("videoFile").value="";
  document.getElementById("uploadPreview").innerHTML="";

  closeModal("uploadModal");

  status("🎉 영상 업로드 완료!");

  await loadAll();

  showHome();
}

function getVideoDuration(file){

  return new Promise((resolve,reject)=>{

    const url =
      URL.createObjectURL(file);

    const video =
      document.createElement("video");

    video.preload="metadata";

    video.onloadedmetadata=()=>{

      URL.revokeObjectURL(url);

      resolve(video.duration);

    };

    video.onerror=()=>{

      URL.revokeObjectURL(url);

      reject(
        new Error("영상 정보를 읽을 수 없습니다.")
      );

    };

    video.src=url;

  });

}

async function watchVideo(id){

  currentVideo =
    videos.find(v=>v.id===id);

  if(!currentVideo) return;

  document.getElementById("watchTitle")
    .textContent=currentVideo.title;

  document.getElementById("watchDescription")
    .textContent=currentVideo.description || "";

  document.getElementById("watchVideo")
    .src=currentVideo.video_url;

  document.getElementById("watchModal")
    .style.display="flex";

  await loadComments(id);
}

async function likeVideo(id){

  const v =
    videos.find(v=>v.id===id);

  if(!v) return;

  const newLikes =
    (v.likes || 0) + 1;

  const {error} =
    await sb
      .from("videos")
      .update({
        likes:newLikes
      })
      .eq("id",id);

  if(error){

    alert("좋아요 실패: " + error.message);

    return;
  }

  v.likes=newLikes;

  status("❤️ 좋아요!");

  renderHome();
}

async function likeCurrent(){

  if(currentVideo){

    await likeVideo(currentVideo.id);

  }

}

function favoriteVideo(id){

  let saved =
    JSON.parse(
      localStorage.getItem("harmonyFavorites") || "[]"
    );

  if(!saved.includes(id)){

    saved.push(id);

    localStorage.setItem(
      "harmonyFavorites",
      JSON.stringify(saved)
    );

    status("⭐ 즐겨찾기에 저장했어요!");

  }else{

    status("⭐ 이미 저장되어 있어요!");

  }

}

function favoriteCurrent(){

  if(currentVideo){

    favoriteVideo(currentVideo.id);

  }

}

async function loadComments(videoId){

  const box =
    document.getElementById("comments");

  box.innerHTML =
    "<p>댓글을 불러오는 중...</p>";

  const {data,error} =
    await sb
      .from("comments")
      .select("*")
      .eq("video_id",videoId)
      .order("created_at",{ascending:false});

  if(error){

    box.innerHTML =
      "<p>댓글을 불러오지 못했어요.</p>";

    return;
  }

  if(!data.length){

    box.innerHTML =
      "<p>첫 번째 댓글을 남겨보세요! 💬</p>";

    return;
  }

  box.innerHTML =
    data.map(c=>`

      <div class="comment">

        <div class="comment-name">
          ${escapeHtml(c.author)}
        </div>

        <div>
          ${escapeHtml(c.text)}
        </div>

      </div>

    `).join("");

}

async function addComment(){

  if(!currentVideo) return;

  const author =
    document
      .getElementById("commentAuthor")
      .value.trim();

  const text =
    document
      .getElementById("commentText")
      .value.trim();

  if(!author || !text){

    alert("이름과 댓글을 입력해 주세요.");

    return;
  }

  const {error} =
    await sb
      .from("comments")
      .insert({
        video_id:currentVideo.id,
        author,
        text
      });

  if(error){

    alert("댓글 작성 실패: " + error.message);

    return;
  }

  document.getElementById("commentText").value="";

  status("💬 댓글을 작성했어요!");

  await loadComments(currentVideo.id);

}

async function openCameraModal(){

  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:true
      });

    document.getElementById("cameraVideo")
      .srcObject=cameraStream;

    document.getElementById("cameraModal")
      .style.display="flex";

  }catch(e){

    alert(
      "카메라를 사용할 수 없어요.\n" +
      "브라우저의 카메라 권한을 확인해 주세요."
    );

  }

}

function startRecording(){

  if(!cameraStream){

    alert("카메라를 먼저 열어주세요.");

    return;
  }

  recordedChunks=[];

  mediaRecorder =
    new MediaRecorder(cameraStream);

  mediaRecorder.ondataavailable=e=>{

    if(e.data.size>0){

      recordedChunks.push(e.data);

    }

  };

  mediaRecorder.onstop=()=>{

    const blob =
      new Blob(
        recordedChunks,
        {type:"video/webm"}
      );

    const file =
      new File(
        [blob],
        "harmony_camera_" +
        Date.now() +
        ".webm",
        {type:"video/webm"}
      );

    stopCamera();

    openUploadModal();

    const dt =
      new DataTransfer();

    dt.items.add(file);

    document.getElementById("videoFile")
      .files=dt.files;

    previewVideo();

  };

  mediaRecorder.start();

  document.getElementById("recordStatus")
    .textContent="🔴 녹화 중...";

}

function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ){

    mediaRecorder.stop();

  }

}

function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(track=>track.stop());

    cameraStream=null;

  }

  document.getElementById("cameraModal")
    .style.display="none";

  document.getElementById("recordStatus")
    .textContent="";

}

function closeModal(id){

  document.getElementById(id)
    .style.display="none";

  if(id==="cameraModal"){

    stopCamera();

  }

}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return escapeHtml(value);

}

loadAll();
