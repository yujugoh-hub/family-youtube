.hidden{display:none!important}
.modal{

  inset:0;
  z-index:100;

  justify-content:center;
  padding:15px;

.modal-box{

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  doc,
  updateDoc,
  arrayUnion
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDD0pJ3pWHPLw_bgte-0Jbr-YaDqhiABv0",
  authDomain: "family-98068.firebaseapp.com",
  projectId: "family-98068",
  storageBucket: "family-98068.firebasestorage.app",
  messagingSenderId: "844890840827",
  appId: "1:844890840827:web:d7f98a4e54eb418b595a5e",
  measurementId: "G-LXQT974FF6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let firebaseOK = false;
let channels = [];
let videos = [];
let favorites = JSON.parse(localStorage.getItem("familyYT_favorites") || "[]");

let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob = null;
let cameraStream = null;

const $ = id => document.getElementById(id);

function setStatus(text, good=false){
  $("status").textContent = text;
  $("status").style.background = good ? "#e9ffe9" : "#fff8d9";
}

async function loadData(){

  try{
    const cSnap = await getDocs(collection(db,"channels"));

    channels = [];
    cSnap.forEach(d=>{
      channels.push({
        id:d.id,
        ...d.data()
      });
    });

    const vSnap = await getDocs(collection(db,"videos"));

    videos = [];
    vSnap.forEach(d=>{
      videos.push({
        id:d.id,
        ...d.data()
      });
    });

    firebaseOK = true;
    setStatus("?곻툘 Firebase ?곌껐 ?깃났! 媛議깃낵 怨듭쑀??以鍮꾧? ?먯뼱??",true);

  }catch(e){

    console.log(e);

    firebaseOK = false;

    channels = JSON.parse(localStorage.getItem("familyYT_channels") || "[]");
    videos = JSON.parse(localStorage.getItem("familyYT_videos") || "[]");

    setStatus("?좑툘 Firebase ?곗씠?곕쿋?댁뒪 ?ㅼ젙 ?꾩씠?먯슂. ?꾩옱 ??湲곌린?먯꽌 癒쇱? ?ъ슜?????덉뼱??");
  }

  renderAll();
}

function saveLocal(){

  localStorage.setItem(
    "familyYT_channels",
    JSON.stringify(channels)
  );

  localStorage.setItem(
    "familyYT_videos",
    JSON.stringify(videos)
  );
}

function renderAll(){
  renderVideos();
  renderChannels();
  renderFavorites();
  fillChannelSelects();
}

function renderVideos(list=videos){

  const grid = $("videoGrid");

  if(!list.length){
    grid.innerHTML = `
      <div class="empty">
        <div style="font-size:50px">?렗</div>
        <h3>?꾩쭅 ?숈쁺?곸씠 ?놁뼱??</h3>
        <p>泥?踰덉㎏ ?숈쁺?곸쓣 ?щ젮蹂댁꽭??</p>
      </div>`;
    return;
  }

  grid.innerHTML = list.map(videoCard).join("");
}

function videoCard(v){

  const channel = channels.find(c=>c.id===v.channelId);
  const channelName = channel ? channel.name : "?????녿뒗 梨꾨꼸";

  return `
  <article class="card">

    <div class="thumb">
      ${
        v.thumbnail
        ? `<img src="${v.thumbnail}">`
        : `<span>?렗</span>`
      }
    </div>

    <div class="card-body">
      <h3>${escapeHTML(v.title || "?쒕ぉ ?놁쓬")}</h3>

      <div class="small">
        ?벟 ${escapeHTML(channelName)}
      </div>

      <div class="actions">
        <button onclick="watchVideo('${v.id}')">??蹂닿린</button>
        <button onclick="likeVideo('${v.id}')">?ㅿ툘 ${v.likes || 0}</button>
        <button onclick="favoriteVideo('${v.id}')">狩?/button>
      </div>
    </div>

  </article>`;
}

function renderChannels(){

  const grid = $("channelGrid");

  if(!channels.length){

    grid.innerHTML = `
      <div class="empty">
        <div style="font-size:50px">?벟</div>
        <h3>?꾩쭅 梨꾨꼸???놁뼱??</h3>
        <button onclick="openChannelForm()">竊?泥?梨꾨꼸 留뚮뱾湲?/button>
      </div>`;

    return;
  }

  grid.innerHTML = channels.map(c=>`

    <article class="channel-card">

      <div class="avatar">
        ${
          c.icon
          ? `<img src="${c.icon}">`
          : `?벟`
        }
      </div>

      <h2>${escapeHTML(c.name)}</h2>

      <p>${escapeHTML(c.owner || "")}</p>

      <p class="small">${escapeHTML(c.bio || "?뚭컻媛 ?놁뒿?덈떎.")}</p>

      <button onclick="showChannel('${c.id}')">
        梨꾨꼸 蹂닿린
      </button>

    </article>

  `).join("");
}

function renderFavorites(){

  const list = videos.filter(v=>favorites.includes(v.id));

  $("favoriteGrid").innerHTML = list.length
    ? list.map(videoCard).join("")
    : `<div class="empty">狩??꾩쭅 利먭꺼李얘린???곸긽???놁뼱??</div>`;
}

function fillChannelSelects(){

  const selects = [
    $("uploadChannel"),
    $("recordChannel")
  ];

  selects.forEach(select=>{

    if(!select)return;

    select.innerHTML = channels.length
      ? channels.map(c=>
          `<option value="${c.id}">
            ${escapeHTML(c.name)}
          </option>`
        ).join("")
      : `<option value="">梨꾨꼸??癒쇱? 留뚮뱾?댁＜?몄슂</option>`;
  });
}

window.openChannelForm = function(){

  $("modalContent").innerHTML = `

    <h2>?벟 ??梨꾨꼸 留뚮뱾湲?/h2>

    <label>梨꾨꼸 ?대쫫</label>
    <input id="newChannelName" placeholder="?? ?좎＜???섎（">

    <label>留뚮뱺 ?щ엺</label>
    <input id="newChannelOwner" placeholder="?? ?좎＜">

    <label>梨꾨꼸 ?뚭컻</label>
    <textarea id="newChannelBio"
      placeholder="??梨꾨꼸?먯꽌???대뼡 ?곸긽???щ┫源뚯슂?"></textarea>

    <label>梨꾨꼸 ?꾩씠肄?/label>
    <input id="newChannelIcon" type="file" accept="image/*">

    <button onclick="createChannel()">
      梨꾨꼸 留뚮뱾湲?
    </button>
  `;

  $("modal").classList.remove("hidden");
};

window.createChannel = async function(){

  const name = $("newChannelName").value.trim();
  const owner = $("newChannelOwner").value.trim();
  const bio = $("newChannelBio").value.trim();
  const iconFile = $("newChannelIcon").files[0];

  if(!name){
    alert("梨꾨꼸 ?대쫫???낅젰?댁＜?몄슂.");
    return;
  }

  let icon = "";

  if(iconFile){
    icon = await fileToDataURL(iconFile);
  }

  const data = {
    name,
    owner,
    bio,
    icon,
    createdAt:serverTimestamp()
  };

  try{

    if(firebaseOK){

      const result = await addDoc(
        collection(db,"channels"),
        data
      );

      channels.push({
        id:result.id,
        ...data
      });

    }else{

      channels.push({
        id:"local_" + Date.now(),
        ...data
      });

      saveLocal();
    }

    closeModal();
    renderAll();

    alert("梨꾨꼸??留뚮뱾?댁죱?댁슂! ?벟");

  }catch(e){

    console.error(e);
    alert("梨꾨꼸 留뚮뱾湲곗뿉 ?ㅽ뙣?덉뼱??");
  }
};

window.uploadVideo = async function(){

  const channelId = $("uploadChannel").value;
  const file = $("videoFile").files[0];
  const title = $("videoTitle").value.trim();
  const description = $("videoDescription").value.trim();
  const thumbFile = $("thumbFile").files[0];

  if(!channelId){
    alert("癒쇱? 梨꾨꼸??留뚮뱾?댁＜?몄슂.");
    return;
  }

  if(!file){
    alert("?숈쁺???뚯씪???좏깮?댁＜?몄슂.");
    return;
  }

  if(!title){
    alert("?숈쁺???쒕ぉ???낅젰?댁＜?몄슂.");
    return;
  }

  if(!firebaseOK){

    if(file.size > 8*1024*1024){

      alert(
        "?꾩옱 Firebase ?곌껐 ?꾩씠?????숈쁺?곸? ??ν븷 ???놁뼱??\n" +
        "8MB ?댄븯???곸긽???ъ슜?댁＜?몄슂."
      );

      return;
    }

    const videoURL = await fileToDataURL(file);
    const thumbnail = thumbFile
      ? await fileToDataURL(thumbFile)
      : "";

    videos.unshift({
      id:"local_" + Date.now(),
      channelId,
      title,
      description,
      videoURL,
      thumbnail,
      likes:0,
      createdAt:Date.now()
    });

    saveLocal();
    renderAll();

    alert("??湲곌린???곸긽????λ릱?댁슂.\nFirebase瑜??곌껐?섎㈃ 媛議?怨듭쑀媛 媛?ν빐??");

    return;
  }

  try{

    setStatus("燧놅툘 ?숈쁺?곸쓣 Firebase???낅줈?쒗븯怨??덉뼱??..");

    const fileRef = ref(
      storage,
      "videos/" + Date.now() + "_" + file.name
    );

    await uploadBytes(fileRef,file);

    const videoURL = await getDownloadURL(fileRef);

    let thumbnail = "";

    if(thumbFile){

      const thumbRef = ref(
        storage,
        "thumbnails/" + Date.now() + "_" + thumbFile.name
      );

      await uploadBytes(thumbRef,thumbFile);

      thumbnail = await getDownloadURL(thumbRef);
    }

    const data = {
      channelId,
      title,
      description,
      videoURL,
      thumbnail,
      likes:0,
      createdAt:serverTimestamp()
    };

    const result = await addDoc(
      collection(db,"videos"),
      data
    );

    videos.unshift({
      id:result.id,
      ...data
    });

    setStatus("?곻툘 ?숈쁺?곸씠 媛議?YouTube???щ씪媛붿뼱??",true);

    alert("?숈쁺???낅줈???꾨즺! ?럦");

    $("videoFile").value="";
    $("thumbFile").value="";
    $("videoTitle").value="";
    $("videoDescription").value="";

    renderAll();

  }catch(e){

    console.error(e);

    setStatus("?좑툘 Firebase ?낅줈???ㅼ젙???뺤씤?댁빞 ?댁슂.");

    alert(
      "?낅줈?쒖뿉 ?ㅽ뙣?덉뼱??\n\n" +
      "Firebase Storage媛 ?꾩쭅 ?ㅼ젙?섏? ?딆븯??媛?μ꽦???덉뼱??"
    );
  }
};

window.watchVideo = function(id){

  const v = videos.find(x=>x.id===id);

  if(!v)return;

  const channel = channels.find(c=>c.id===v.channelId);

  $("modalContent").innerHTML = `

    <h2>${escapeHTML(v.title)}</h2>

    <video src="${v.videoURL}" controls playsinline></video>

    <p>
      ?벟 ${escapeHTML(channel?.name || "梨꾨꼸 ?놁쓬")}

    <div class="actions">
      <button onclick="likeVideo('${v.id}');watchVideo('${v.id}')">

      </button>

      <button onclick="favoriteVideo('${v.id}');watchVideo('${v.id}')">
        狩?利먭꺼李얘린
      </button>
    </div>

    <hr>

    <h3>?뮠 ?볤?</h3>

    <input id="commentInput"
      placeholder="?볤????낅젰?섏꽭??>

    <button onclick="addComment('${v.id}')">
      ?볤? ?곌린
    </button>

    <div id="commentList">
      ${(v.comments || []).map(c=>`
        <div class="comment">
          <b>${escapeHTML(c.name || "媛議?)}</b>
          <div>${escapeHTML(c.text)}</div>
        </div>
      `).join("")}
    </div>
  `;

  $("modal").classList.remove("hidden");
};

window.likeVideo = async function(id){

  const v = videos.find(x=>x.id===id);

  if(!v)return;

  v.likes = (v.likes || 0) + 1;

  if(firebaseOK && !String(id).startsWith("local_")){

    try{

      await updateDoc(
        doc(db,"videos",id),
        {likes:v.likes}
      );

    }catch(e){
      console.log(e);
    }
  }else{
    saveLocal();
  }

window.startRecording = function(){

  if(!cameraStream){

    alert("癒쇱? 移대찓?쇰? 耳쒖＜?몄슂.");
    return;
  }

  recordedChunks=[];

  let options={};

  if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")){
    options={mimeType:"video/webm;codecs=vp9,opus"};
  }else if(MediaRecorder.isTypeSupported("video/webm")){
    options={mimeType:"video/webm"};
  }

  try{

    mediaRecorder = new MediaRecorder(
      cameraStream,
      options
    );

  }catch(e){

    mediaRecorder = new MediaRecorder(cameraStream);
  }

  mediaRecorder.ondataavailable = e=>{

    if(e.data.size>0){
      recordedChunks.push(e.data);
    }
  };

  mediaRecorder.onstop = ()=>{

    recordedBlob = new Blob(
      recordedChunks,
      {type:mediaRecorder.mimeType || "video/webm"}
    );

    const url = URL.createObjectURL(recordedBlob);

    $("recordedPreview").src=url;
    $("recordedPreview").classList.remove("hidden");
    $("recordUploadBox").classList.remove("hidden");

    $("recordStatus").textContent =
      "?렗 珥ъ쁺 ?꾨즺! 誘몃━ 蹂닿퀬 ?щ┫ ???덉뼱??";
  };

  mediaRecorder.start();

  $("recordStatus").textContent =
    "?뵶 珥ъ쁺 以?..";

};

window.stopRecording = function(){

  if(mediaRecorder && mediaRecorder.state!=="inactive"){
    mediaRecorder.stop();
  }

  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream=null;
  }
};

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function fileToDataURL(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}

function blobToDataURL(blob){

  return fileToDataURL(
    new File([blob],"recorded.webm",{
      type:blob.type
    })
  );
}
