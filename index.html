<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HARMONY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f7fb;color:#202124}
body{overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
button:active{transform:scale(.97)}

.app{max-width:760px;margin:auto;min-height:100vh;background:white}

.header{
 position:sticky;top:0;z-index:50;height:64px;
 display:flex;align-items:center;gap:9px;padding:8px 12px;
 background:white;border-bottom:1px solid #eee
}
.logo{font-size:21px;font-weight:900;white-space:nowrap}
.search{
 flex:1;min-width:0;height:44px;border:1px solid #ddd;
 border-radius:22px;padding:0 15px;background:#f7f7f7;outline:none
}
.iconBtn{
 position:relative;width:44px;height:44px;border-radius:50%;
 background:#f1f3f5;font-size:21px;flex:none
}
.badge{
 position:absolute;top:0;right:-2px;min-width:18px;height:18px;
 border-radius:10px;background:#ff3b30;color:white;font-size:10px;
 display:flex;align-items:center;justify-content:center
}

.page{display:none;padding:16px;padding-bottom:100px}
.page.active{display:block}

.hero{
 padding:24px 18px;border-radius:24px;
 background:linear-gradient(135deg,#eef5ff,#f8efff);margin-bottom:15px
}
.hero h1{margin:0 0 8px;font-size:29px}
.hero p{margin:0;color:#666;line-height:1.5}

.sectionTitle{font-size:20px;font-weight:900;margin:22px 0 12px}

.bigCamera{
 width:100%;min-height:110px;border-radius:25px;
 background:#111;color:white;font-size:26px;font-weight:900;
 margin-bottom:10px
}
.secondaryBtn,.primaryBtn{
 width:100%;min-height:56px;border-radius:17px;
 font-size:17px;font-weight:800;margin-bottom:10px
}
.secondaryBtn{background:#eef1f5;color:#222}
.primaryBtn{background:#111;color:white;margin-top:8px}

.card{
 background:white;border:1px solid #eee;border-radius:20px;
 padding:15px;margin-bottom:12px;box-shadow:0 4px 15px rgba(0,0,0,.04)
}

.videoCard{padding:0;overflow:hidden;cursor:pointer}
.videoThumb{
 width:100%;aspect-ratio:16/9;display:block;
 background:#111;object-fit:cover
}
.videoInfo{padding:14px}
.videoTitle{font-size:18px;font-weight:900;margin-bottom:7px}
.muted{color:#777;font-size:14px}

.channelRow{display:flex;gap:12px;align-items:center}
.channelIcon{
 width:56px;height:56px;border-radius:50%;background:#eef1ff;
 display:flex;align-items:center;justify-content:center;
 font-size:28px;flex:none
}
.channelName{font-size:18px;font-weight:900}

.formGroup{margin-bottom:14px}
.formGroup label{display:block;font-weight:800;margin-bottom:7px}
.formGroup input,.formGroup textarea,.formGroup select{
 width:100%;border:1px solid #ddd;border-radius:14px;
 padding:13px;background:#fafafa;outline:none
}
.formGroup textarea{min-height:100px;resize:vertical}

.fileBox{
 padding:18px;border:2px dashed #ddd;border-radius:18px;
 text-align:center;margin-bottom:14px
}
.fileBox input{width:100%}
.preview{
 width:100%;max-height:380px;margin-top:12px;
 border-radius:15px;background:#111
}

.cameraWrap{background:#111;border-radius:20px;overflow:hidden}
#cameraPreview{width:100%;display:block;background:#111}
.cameraControls{display:flex;gap:10px;padding:12px}
.cameraControls button{
 flex:1;min-height:54px;border-radius:14px;font-weight:900
}
.record{background:#ff3b30;color:white}
.stop{background:white;color:#111}

.empty{text-align:center;padding:40px 10px;color:#888}

.bottomNav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(760px,100%);height:74px;display:flex;
 background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
 border-top:1px solid #eee;z-index:60
}
.navItem{
 flex:1;background:none;color:#666;font-size:11px;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:3px
}
.navItem span:first-child{font-size:21px}
.navItem.active{color:#111;font-weight:900}

.modal{
 display:none;position:fixed;inset:0;z-index:100;
 background:rgba(0,0,0,.65);align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.modalBox{
 width:min(760px,100%);max-height:92vh;overflow:auto;
 background:white;border-radius:25px 25px 0 0;padding:18px
}
.modalTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.close{width:42px;height:42px;border-radius:50%;background:#eee}
#modalVideo{width:100%;max-height:50vh;background:#000;border-radius:15px}
.comment{padding:12px 0;border-bottom:1px solid #eee}

.notice{
 padding:13px;border-radius:14px;background:#f3f6ff;margin-top:10px
}

@media(max-width:430px){
 .header{height:58px}
 .logo{font-size:18px}
 .search{height:40px}
 .iconBtn{width:40px;height:40px}
 .page{padding:12px;padding-bottom:95px}
 .hero h1{font-size:25px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
 <div class="logo">HARMONY</div>

 <input
   id="searchInput"
   class="search"
   placeholder="동영상 검색"
   oninput="searchVideos()"
 >

 <button
   class="iconBtn"
   type="button"
   onclick="showPage('notifications')"
 >
   🔔
   <span id="notificationBadge" class="badge" style="display:none">0</span>
 </button>
</header>

<main>

<section id="home" class="page active">

 <div class="hero">
  <h1>우리 가족 HARMONY 💛</h1>
  <p>
   가족이 각자의 채널을 만들고<br>
   동영상을 함께 나눠보세요.
  </p>
 </div>

 <button class="bigCamera" type="button" onclick="startCamera()">
  🎥 촬영하기
 </button>

 <button class="secondaryBtn" type="button" onclick="showPage('upload')">
  📱 앨범에서 동영상 선택
 </button>

 <button class="secondaryBtn" type="button" onclick="showPage('createChannel')">
  📺 내 채널 만들기
 </button>

 <div class="sectionTitle">✨ 최신 동영상</div>
 <div id="homeVideos"></div>

</section>


<section id="videos" class="page">

 <div class="sectionTitle">📹 동영상</div>
 <div id="videoList"></div>

</section>


<section id="channels" class="page">

 <div class="sectionTitle">📺 가족 채널</div>

 <button class="secondaryBtn" type="button" onclick="showPage('createChannel')">
  ➕ 새 채널 만들기
 </button>

 <div id="channelList"></div>

</section>


<section id="subscriptions" class="page">

 <div class="sectionTitle">🔔 구독한 채널</div>

 <div id="subscriptionList">
  <div class="empty">
   아직 구독한 채널이 없어요.<br>
   📺 채널에서 마음에 드는 채널을 구독해 보세요!
  </div>
 </div>

</section>


<section id="channelView" class="page">

 <div class="sectionTitle">📺 채널 보기</div>

 <button
   class="secondaryBtn"
   type="button"
   onclick="showPage('channels')"
 >
  ← 채널 목록
 </button>

 <div id="channelViewInfo" class="card"></div>

 <div class="sectionTitle">🎬 이 채널의 동영상</div>
 <div id="channelVideoList"></div>

</section>


<section id="createChannel" class="page">

 <div class="sectionTitle">📺 채널 만들기</div>

 <div class="card">

  <div class="formGroup">
   <label>채널 이름</label>
   <input id="channelName" placeholder="예: 유주의 만들기 채널">
  </div>

  <div class="formGroup">
   <label>채널 설명</label>
   <textarea id="channelDescription" placeholder="내 채널을 소개해 주세요"></textarea>
  </div>

  <div class="formGroup">
   <label>만든 사람</label>
   <input id="channelOwner" placeholder="예: 유주">
  </div>

  <button class="primaryBtn" type="button" onclick="createChannel()">
   📺 채널 만들기
  </button>

 </div>

</section>


<section id="upload" class="page">

 <div class="sectionTitle">⬆️ 동영상 올리기</div>

 <div class="card">

  <div class="fileBox">

   <div style="font-size:45px">🎬</div>

   <div style="font-weight:800;margin:8px">
    동영상 선택
   </div>

   <input
     id="videoFile"
     type="file"
     accept="video/*"
     onchange="previewVideo(event)"
   >

   <video
     id="preview"
     class="preview"
     controls
     style="display:none"
   ></video>

  </div>

  <div class="formGroup">
   <label>동영상 제목</label>
   <input id="videoTitle" placeholder="동영상 제목">
  </div>

  <div class="formGroup">
   <label>설명</label>
   <textarea id="videoDescription" placeholder="동영상 설명"></textarea>
  </div>

  <div class="formGroup">
   <label>채널</label>
   <select id="videoChannel">
    <option value="">채널을 선택하세요</option>
   </select>
  </div>

  <button class="primaryBtn" type="button" onclick="uploadVideo()">
   ⬆️ 동영상 올리기
  </button>

  <div id="uploadStatus" class="notice" style="display:none"></div>

 </div>

 <div class="muted">
  ⏱️ 동영상은 최대 30분까지 올릴 수 있어요.
 </div>

</section>


<section id="camera" class="page">

 <div class="sectionTitle">🎥 동영상 촬영</div>

 <div class="cameraWrap">

  <video
    id="cameraPreview"
    autoplay
    playsinline
    muted
  ></video>

  <div class="cameraControls">

   <button
     class="record"
     id="recordBtn"
     type="button"
     onclick="startRecording()"
   >
    🔴 촬영 시작
   </button>

   <button
     class="stop"
     id="stopBtn"
     type="button"
     onclick="stopRecording()"
     disabled
   >
    ⏹️ 촬영 끝
   </button>

  </div>

 </div>

 <div id="recordStatus" class="notice">
  카메라를 준비하고 있어요.
 </div>

 <video
   id="recordedPreview"
   class="preview"
   controls
   style="display:none"
 ></video>

 <button
   id="useRecordingBtn"
   class="primaryBtn"
   type="button"
   onclick="useRecording()"
   style="display:none"
 >
  📤 이 동영상 사용하기
 </button>

</section>


<section id="favorites" class="page">

 <div class="sectionTitle">⭐ 즐겨찾기</div>
 <div id="favoriteList"></div>

</section>


<section id="notifications" class="page">

 <div class="sectionTitle">🔔 알림</div>
 <div id="notificationList"></div>

</section>

</main>


<nav class="bottomNav">

 <button class="navItem" type="button" onclick="showPage('home')">
  <span>🏠</span>
  <span>홈</span>
 </button>

 <button class="navItem" type="button" onclick="showPage('videos')">
  <span>🎬</span>
  <span>동영상</span>
 </button>

 <button class="navItem" type="button" onclick="showPage('channels')">
  <span>📺</span>
  <span>채널</span>
 </button>

 <button class="navItem" type="button" onclick="showPage('subscriptions')">
  <span>🔔</span>
  <span>구독</span>
 </button>

 <button class="navItem" type="button" onclick="showPage('favorites')">
  <span>⭐</span>
  <span>즐겨찾기</span>
 </button>

</nav>

</div>


<div id="videoModal" class="modal">

 <div class="modalBox">

  <div class="modalTop">

   <strong id="modalTitle">동영상</strong>

   <button
     class="close"
     type="button"
     onclick="closeVideo()"
   >
    ✕
   </button>

  </div>

  <video
    id="modalVideo"
    controls
    playsinline
  ></video>

  <div
    id="modalDescription"
    class="muted"
    style="margin-top:10px"
  ></div>

  <button
    id="modalLikeBtn"
    class="primaryBtn"
    type="button"
    onclick="likeCurrentVideo()"
  >
   ❤️ 좋아요
  </button>

  <button
    id="modalFavoriteBtn"
    class="secondaryBtn"
    type="button"
    onclick="favoriteCurrentVideo()"
  >
   ⭐ 즐겨찾기
  </button>

  <div class="sectionTitle">💬 댓글</div>

  <div style="display:flex;gap:8px">

   <input
     id="commentInput"
     placeholder="댓글을 입력하세요"
     style="flex:1;border:1px solid #ddd;border-radius:14px;padding:12px"
   >

   <button
     class="primaryBtn"
     type="button"
     onclick="addComment()"
     style="width:100px;margin:0"
   >
    등록
   </button>

  </div>

  <div id="commentList"></div>

 </div>

</div>


<script>

const SUPABASE_URL = "https://iunngbsdbvwpcgayluns.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ry5rF5t2eTVxLiBdJQmAKA_y1T2lzrT";

const supabaseClient = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentVideo = null;
let currentRecordingBlob = null;
let cameraStream = null;
let mediaRecorder = null;
let recordedChunks = [];

let subscriptions = JSON.parse(
 localStorage.getItem("harmonySubscriptions") || "[]"
);

let favorites = JSON.parse(
 localStorage.getItem("harmonyFavorites") || "[]"
);

function saveSubscriptions(){
 localStorage.setItem(
  "harmonySubscriptions",
  JSON.stringify(subscriptions)
 );
}

function saveFavorites(){
 localStorage.setItem(
  "harmonyFavorites",
  JSON.stringify(favorites)
 );
}

function escapeHtml(value){
 return String(value || "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* =========================
   페이지 이동
========================= */

function showPage(pageId){

 document.querySelectorAll(".page").forEach(function(page){
  page.classList.remove("active");
 });

 const page = document.getElementById(pageId);

 if(!page){
  console.error("페이지 없음:",pageId);
  return;
 }

 page.classList.add("active");

 window.scrollTo({
  top:0,
  behavior:"instant"
 });

 if(pageId === "home"){
  loadVideos("homeVideos");
 }

 if(pageId === "videos"){
  loadVideos("videoList");
 }

 if(pageId === "channels"){
  loadChannels();
 }

 if(pageId === "subscriptions"){
  loadSubscriptions();
 }

 if(pageId === "favorites"){
  loadFavorites();
 }

 if(pageId === "notifications"){
  loadNotifications();
 }

 if(pageId === "upload"){
  loadChannelSelect();
 }

 if(pageId === "camera"){
  startCamera();
 }

 updateNav(pageId);
}


/* =========================
   하단 메뉴
========================= */

function updateNav(pageId){

 const map = {
  home:0,
  videos:1,
  channels:2,
  subscriptions:3,
  favorites:4
 };

 document.querySelectorAll(".navItem").forEach(function(btn,i){
  btn.classList.toggle("active",map[pageId] === i);
 });

}


/* =========================
   동영상
========================= */

async function loadVideos(containerId){

 const box = document.getElementById(containerId);

 if(!box) return;

 box.innerHTML =
  '<div class="empty">동영상을 불러오는 중...</div>';

 const result = await supabaseClient
  .from("videos")
  .select("*, channels(name,owner)")
  .order("created_at",{ascending:false});

 if(result.error){

  console.error(result.error);

  box.innerHTML =
   '<div class="empty">동영상을 불러오지 못했어요.</div>';

  return;
 }

 const videos = result.data || [];

 if(videos.length === 0){

  box.innerHTML =
   '<div class="empty">아직 동영상이 없어요.<br>🎬 첫 동영상을 올려보세요!</div>';

  return;
 }

 box.innerHTML = "";

 videos.forEach(function(video){

  const card = document.createElement("div");

  card.className = "card videoCard";

  const thumb = document.createElement("video");

  thumb.className = "videoThumb";
  harmonyVideoUrl(video).then(function(url){
   if(url){
      thumb.src = url;
   }
});
  thumb.muted = true;
  thumb.playsInline = true;
  thumb.preload = "metadata";

  const info = document.createElement("div");

  info.className = "videoInfo";

  info.innerHTML =
   '<div class="videoTitle">' +
   escapeHtml(video.title) +
   '</div>' +

   '<div class="muted">📺 ' +
   escapeHtml(video.channels?.name || "채널 없음") +
   '</div>' +

   '<div class="muted" style="margin-top:5px">' +
   '❤️ ' + Number(video.likes || 0) +
   '</div>';

  card.appendChild(thumb);
  card.appendChild(info);

  /* 버튼 없음!
     카드 자체를 누르면 동영상 열림 */
  card.addEventListener("click",function(){
   openVideo(video);
  });

  box.appendChild(card);

 });

}


/* =========================
   검색
========================= */

async function searchVideos(){

 const keyword =
  document.getElementById("searchInput").value
   .trim()
   .toLowerCase();

 const box = document.getElementById("videoList");

 if(!keyword){
  showPage("videos");
  return;
 }

 document.querySelectorAll(".page").forEach(function(p){
  p.classList.remove("active");
 });

 document.getElementById("videos").classList.add("active");

 box.innerHTML =
  '<div class="empty">검색 중...</div>';

 const result = await supabaseClient
  .from("videos")
  .select("*, channels(name,owner)")
  .order("created_at",{ascending:false});

 if(result.error){
  box.innerHTML =
   '<div class="empty">검색할 수 없어요.</div>';
  return;
 }

 const list = (result.data || []).filter(function(video){

  return (
   String(video.title || "").toLowerCase().includes(keyword) ||
   String(video.description || "").toLowerCase().includes(keyword)
  );

 });

 box.innerHTML = "";

 if(list.length === 0){

  box.innerHTML =
   '<div class="empty">검색 결과가 없어요.</div>';

  return;
 }

 list.forEach(function(video){

  const card = document.createElement("div");

  card.className = "card videoCard";

  const thumb = document.createElement("video");

  thumb.className = "videoThumb";
  harmonyVideoUrl(video).then(function(url){
   if(url){
      thumb.src = url;
   }
});
  thumb.muted = true;
  thumb.playsInline = true;
  thumb.preload = "metadata";

  const info = document.createElement("div");

  info.className = "videoInfo";

  info.innerHTML =
   '<div class="videoTitle">' +
   escapeHtml(video.title) +
   '</div>' +

   '<div class="muted">📺 ' +
   escapeHtml(video.channels?.name || "채널 없음") +
   '</div>';

  card.appendChild(thumb);
  card.appendChild(info);

  card.addEventListener("click",function(){
   openVideo(video);
  });

  box.appendChild(card);

 });

}


/* =========================
   동영상 열기
========================= */

async function openVideo(video){

 currentVideo = video;

 document.getElementById("modalTitle").textContent =
  video.title || "동영상";

 document.getElementById("modalDescription").textContent =
  video.description || "";

 const player =
  document.getElementById("modalVideo");

 const url = await window.harmonyVideoUrl(video);

 if(!url){
   alert("동영상을 불러오지 못했어요.");
   return;
 }

 player.src = url;
 player.currentTime = 0;

 document.getElementById("videoModal")
  .classList.add("show");

 loadComments(video.id);

 updateFavoriteButton();

}


function closeVideo(){

 const modal =
  document.getElementById("videoModal");

 const player =
  document.getElementById("modalVideo");

 player.pause();
 player.removeAttribute("src");
 player.load();

 modal.classList.remove("show");

 currentVideo = null;

}


/* =========================
   좋아요
========================= */

async function likeCurrentVideo(){

 if(!currentVideo) return;

 const newLikes =
  Number(currentVideo.likes || 0) + 1;

 const result = await supabaseClient
  .from("videos")
  .update({likes:newLikes})
  .eq("id",currentVideo.id);

 if(result.error){

  console.error(result.error);

  alert("좋아요에 실패했어요.");
  return;

 }

 currentVideo.likes = newLikes;

 document.getElementById("modalLikeBtn").textContent =
  "❤️ 좋아요 완료 (" + newLikes + ")";

 loadVideos("homeVideos");
 loadVideos("videoList");

}


/* =========================
   즐겨찾기
========================= */

function favoriteCurrentVideo(){

 if(!currentVideo) return;

 const id = String(currentVideo.id);

 if(favorites.includes(id)){

  favorites =
   favorites.filter(function(x){
    return x !== id;
   });

  alert("⭐ 즐겨찾기에서 뺐어요.");

 }else{

  favorites.push(id);

  alert("⭐ 즐겨찾기에 저장했어요!");

 }

 saveFavorites();

 updateFavoriteButton();

}


function updateFavoriteButton(){

 if(!currentVideo) return;

 const saved =
  favorites.includes(String(currentVideo.id));

 document.getElementById("modalFavoriteBtn").textContent =
  saved ? "⭐ 즐겨찾기 취소" : "⭐ 즐겨찾기";

}


/* =========================
   댓글
========================= */

async function loadComments(videoId){

/* =========================
   동영상 업로드
========================= */

async function uploadVideo(){

 const file =
  document.getElementById("videoFile").files[0];

 const title =
  document.getElementById("videoTitle")
   .value.trim();

 const description =
  document.getElementById("videoDescription")
   .value.trim();

 const channelId =
  document.getElementById("videoChannel").value;

 const status =
  document.getElementById("uploadStatus");

 if(!file){

  alert("동영상을 선택해주세요.");
  return;

 }

 if(!title){

  alert("동영상 제목을 입력해주세요.");
  return;

 }

 if(!channelId){

  alert("채널을 선택해주세요.");
  return;

 }

 status.style.display = "block";
 status.textContent = "⬆️ 업로드 준비 중...";

 const tempVideo =
  document.createElement("video");

 tempVideo.preload = "metadata";

 tempVideo.src =
  URL.createObjectURL(file);

 tempVideo.onloadedmetadata = async function(){

  URL.revokeObjectURL(tempVideo.src);

  if(tempVideo.duration > 1800){

   status.textContent =
    "⏱️ 30분을 넘는 동영상은 올릴 수 없어요.";

   return;

  }

  const fileName =
   Date.now() +
   "-" +
   Math.random().toString(36).slice(2) +
   "." +
   (file.name.split(".").pop() || "mp4");

  status.textContent =
   "☁️ 동영상 업로드 중...";

  const upload =
   await supabaseClient
    .storage
    .from("videos")
    .upload(fileName,file,{
     cacheControl:"3600",
     upsert:false,
     contentType:file.type
    });

  if(upload.error){

   console.error(upload.error);

   status.textContent =
    "❌ 업로드 실패: " +
    upload.error.message;

   return;

  }

  const publicUrl =
   supabaseClient
    .storage
    .from("videos")
    .getPublicUrl(fileName)
    .data
    .publicUrl;

  status.textContent =
   "📝 동영상 정보를 저장하는 중...";

  const insert =
   await supabaseClient
    .from("videos")
    .insert({
     channel_id:Number(channelId),
     title:title,
     description:description,
     video_url:publicUrl,
     duration:Math.round(tempVideo.duration),
     likes:0
    })
    .select()
    .single();

  if(insert.error){

   console.error(insert.error);

   status.textContent =
    "❌ 정보 저장 실패: " +
    insert.error.message;

   return;

  }

  status.textContent =
   "✅ 동영상이 올라갔어요!";

  alert("🎉 동영상 업로드 완료!");

  document.getElementById("videoFile").value = "";
  document.getElementById("videoTitle").value = "";
  document.getElementById("videoDescription").value = "";
  document.getElementById("videoChannel").value = "";

  document.getElementById("preview").style.display = "none";

  loadVideos("homeVideos");
  loadVideos("videoList");

 };

}

function startRecording(){

 if(!cameraStream){

  alert("먼저 카메라를 준비해주세요.");
  return;

 }

 recordedChunks = [];

 try{

  mediaRecorder =
   new MediaRecorder(cameraStream);

 }catch(error){

  alert("이 브라우저에서는 촬영 기능을 사용할 수 없어요.");
  return;

 }

 mediaRecorder.ondataavailable =
  function(event){

   if(event.data.size > 0){
    recordedChunks.push(event.data);
   }

  };

 mediaRecorder.onstop =
  function(){

   currentRecordingBlob =
    new Blob(
     recordedChunks,
     {type:mediaRecorder.mimeType || "video/webm"}
    );

   const url =
    URL.createObjectURL(currentRecordingBlob);

   const preview =
    document.getElementById("recordedPreview");

   preview.src = url;
   preview.style.display = "block";

   document.getElementById("useRecordingBtn")
    .style.display = "block";

   document.getElementById("recordStatus")
    .textContent =
    "🎉 촬영 완료! 이 동영상을 사용할 수 있어요.";

  };

 mediaRecorder.start();

 document.getElementById("recordBtn").disabled = true;
 document.getElementById("stopBtn").disabled = false;

 document.getElementById("recordStatus")
  .textContent =
  "🔴 촬영 중...";

}


function stopRecording(){

 if(!mediaRecorder) return;

 if(mediaRecorder.state !== "inactive"){
  mediaRecorder.stop();
 }

 document.getElementById("recordBtn").disabled = false;
 document.getElementById("stopBtn").disabled = true;

}

    if(result.error){
      console.error(result.error);
      status.textContent =
        "로그인 실패: " + result.error.message;
      return;
    }

    status.textContent = "가족 인증 완료! 🏠";
    loginBox.style.display = "none";

    if(typeof loadVideos === "function"){
      loadVideos("homeVideos");
      loadVideos("videoList");
    }

  });

  supabaseClient.auth.onAuthStateChange(function(event,session){

    if(session){
      loginBox.style.display = "none";
    }else{
      loginBox.style.display = "flex";
    }

  });

  checkFamily();

})();
</script>

(function(){

  const lock = document.getElementById("harmonyLock");

  const button = document.getElementById("harmonyUnlock");
  const error = document.getElementById("harmonyPinError");

  if(!lock || !pin || !button) return;

  function unlock(){

    if(pin.value === PASSWORD){

      sessionStorage.setItem("harmonyFamilyAccess","yes");

      lock.style.display = "none";
      error.textContent = "";

    }else{

      error.textContent = "비밀번호가 맞지 않아요.";

      pin.value = "";
      pin.focus();

    }
  }

  if(sessionStorage.getItem("harmonyFamilyAccess") === "yes"){
    lock.style.display = "none";
  }

  button.addEventListener("click",unlock);

  pin.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
      unlock();
    }

  });

})();
</script>
<script id="HARMONY_PRIVATE_VIDEO_FIX">
(function(){

  async function harmonyVideoUrl(video){

    if(!video) return "";

    const raw = video.video_url || "";

    try{

      const marker = "/storage/v1/object/public/videos/";

      if(raw.includes(marker)){

        const filePath =
          decodeURIComponent(
            raw.substring(
              raw.indexOf(marker) + marker.length
            )
          );

        const result =
          await supabaseClient
            .storage
            .from("videos")
            .createSignedUrl(filePath, 3600);

        if(result.error){
          console.error("Signed URL error:",result.error);
          return "";
        }

        return result.data.signedUrl;

      }

      return raw;

    }catch(error){

      console.error(error);
      return "";

    }
  }

  window.harmonyVideoUrl = harmonyVideoUrl;

})();
</script>
